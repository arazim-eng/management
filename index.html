<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ארזים הנדסה — ניהול פיקוח</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,Arial,sans-serif;font-size:14px;background:#eeece8;color:#1c1c1a;direction:rtl}
#wrap{display:flex;min-height:100vh}
#sb{width:200px;background:#fff;border-left:1px solid #ddd;position:fixed;right:0;top:0;bottom:0;overflow-y:auto;z-index:10;display:flex;flex-direction:column}
.sb-top{padding:16px 16px 12px;border-bottom:1px solid #ddd}
.sb-brand{font-size:15px;font-weight:700;color:#1860a8}
.sb-sub{font-size:11px;color:#999;margin-top:2px}
.sb-sec{font-size:10px;font-weight:700;color:#bbb;text-transform:uppercase;letter-spacing:.07em;padding:12px 16px 3px}
.ni{display:flex;align-items:center;gap:8px;padding:8px 16px;cursor:pointer;color:#666;font-size:13px}
.ni:hover{background:#f5f3ef;color:#222}
.ni.on{color:#1860a8;font-weight:700;background:#e8f1fb}
.nic{font-size:14px;width:16px;text-align:center}
.nb{margin-right:auto;background:#e03;color:#fff;font-size:10px;font-weight:700;padding:1px 5px;border-radius:9px}
.sb-foot{margin-top:auto;padding:12px 16px;font-size:11px;color:#ccc;border-top:1px solid #eee}
#main{margin-right:200px;flex:1;display:flex;flex-direction:column;min-height:100vh}
#topbar{background:#fff;border-bottom:1px solid #ddd;height:52px;display:flex;align-items:center;padding:0 16px;gap:8px;position:sticky;top:0;z-index:5}
#topbar h2{font-size:15px;font-weight:700;flex:0 0 auto}
#srch-wrap{flex:1;max-width:320px;position:relative;margin:0 8px}
#gsrch{width:100%;padding:6px 10px 6px 10px;border:1px solid #ddd;border-radius:20px;font-size:13px;font-family:inherit;background:#f5f3ef;color:#222}
#gsrch:focus{outline:none;border-color:#1860a8;background:#fff}
#srch-res{position:absolute;top:calc(100% + 5px);right:0;left:0;background:#fff;border:1px solid #ddd;border-radius:8px;box-shadow:0 4px 20px rgba(0,0,0,.12);z-index:100;max-height:340px;overflow-y:auto;display:none}
#srch-res.open{display:block}
.sr-hdr{padding:7px 12px 4px;font-size:10px;font-weight:700;color:#bbb;text-transform:uppercase;letter-spacing:.06em;background:#faf8f5;border-bottom:1px solid #eee}
.sr-item{display:flex;align-items:center;gap:8px;padding:8px 12px;cursor:pointer;font-size:13px;border-bottom:1px solid #f0eeea}
.sr-item:last-child{border-bottom:none}
.sr-item:hover{background:#f5f3ef}
.sr-tag{font-size:10px;font-weight:700;padding:1px 5px;border-radius:4px;flex-shrink:0;white-space:nowrap}
.sr-proj{background:#e8f1fb;color:#1860a8}
.sr-inv{background:#e9f3dc;color:#3a6b10}
.sr-wo{background:#faebd8;color:#834e0a}
#vact{flex:0 0 auto}
#view{padding:20px}
.btn{display:inline-flex;align-items:center;gap:5px;padding:6px 13px;border-radius:6px;border:1px solid #ccc;background:#fff;color:#222;cursor:pointer;font-size:13px;font-weight:600;font-family:inherit;white-space:nowrap}
.btn:hover{background:#f5f3ef}
.btn-blue{background:#1860a8;color:#fff;border-color:#1860a8}
.btn-blue:hover{background:#0c4580}
.btn-sm{padding:3px 9px;font-size:12px}
.btn-ghost{border-color:transparent;background:transparent}
.btn-ghost:hover{background:#f5f3ef}
.btn-red{color:#b02;border-color:#f99}
.btn-red:hover{background:#fde}
.btn-amber{background:#faebd8;color:#834e0a;border-color:#f8c580}
.btn-amber:hover{background:#f5d9b8}
.stats4{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:10px;margin-bottom:16px}
.stats3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:16px}
.scard{background:#fff;border:1px solid #ddd;border-radius:10px;padding:13px 15px}
.slbl{font-size:11px;color:#888;margin-bottom:4px}
.sval{font-size:20px;font-weight:700}
.ssub{font-size:11px;color:#aaa;margin-top:2px}
.tbl-box{background:#fff;border:1px solid #ddd;border-radius:10px;overflow:hidden;margin-bottom:16px}
table{width:100%;border-collapse:collapse}
th{padding:8px 12px;font-size:11px;font-weight:700;color:#888;text-align:right;border-bottom:1px solid #eee;background:#faf8f5;white-space:nowrap;text-transform:uppercase}
td{padding:9px 12px;font-size:13px;border-bottom:1px solid #f0eeea;vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:#faf9f7}
tfoot td{padding:8px 12px;font-size:13px;font-weight:700;background:#faf8f5;border-top:1px solid #ddd}
.empty{padding:32px;text-align:center;color:#bbb;font-size:13px}
.pill{display:inline-flex;align-items:center;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:700;cursor:pointer;white-space:nowrap}
.pill:hover{opacity:.8}
.badge{display:inline-flex;padding:2px 7px;border-radius:4px;font-size:11px;font-weight:600}
.b-osek{background:#e8f1fb;color:#1860a8}
.b-chev{background:#eeedfd;color:#3b3387}
.b-cont{background:#e9f3dc;color:#3a6b10}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex-shrink:0}
.wo-ok{background:#e9f3dc;color:#3a6b10;border:1px solid #bde090;border-radius:4px;font-size:11px;padding:2px 7px;display:inline-flex;align-items:center;gap:3px}
.wo-no{color:#834e0a;font-size:11px}
.fin-cell{font-size:12px;line-height:1.6}
.fin-ok{color:#3a6b10;font-weight:600}
.fin-warn{color:#834e0a;font-weight:600}
.fin-neg{color:#b02;font-weight:600}
.al{display:flex;align-items:center;gap:8px;padding:8px 12px;background:#faebd8;border:1px solid #f8c580;border-radius:7px;margin-bottom:5px;font-size:13px;color:#5a3200}
.al-act{margin-right:auto;font-size:12px;color:#834e0a;cursor:pointer;font-weight:700;text-decoration:underline}
.fbar{display:flex;gap:7px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
.fbar select,.fbar input[type=text]{padding:6px 9px;border:1px solid #ccc;border-radius:6px;background:#fff;color:#222;font-size:13px;font-family:inherit}
.fbar input[type=text]{width:150px}
#mbg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:100;align-items:center;justify-content:center}
#mbg.open{display:flex}
.modal{background:#fff;border-radius:12px;padding:22px;width:640px;max-width:calc(100vw - 24px);max-height:calc(100vh - 50px);overflow-y:auto}
.mhdr{display:flex;align-items:center;margin-bottom:18px}
.mtitle{font-size:15px;font-weight:700;flex:1}
.mx{background:none;border:none;font-size:22px;cursor:pointer;color:#aaa;line-height:1;font-family:inherit}
.mx:hover{color:#222}
.mftr{display:flex;justify-content:flex-end;gap:7px;margin-top:16px;padding-top:14px;border-top:1px solid #eee}
.fg2{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.fg{display:flex;flex-direction:column;gap:4px}
.fg.w2{grid-column:1/-1}
.flbl{font-size:11px;font-weight:700;color:#888}
.fi,.fs,.fta{padding:7px 10px;border:1px solid #ccc;border-radius:6px;font-size:13px;font-family:inherit;color:#222;background:#fff}
.fi:focus,.fs:focus,.fta:focus{outline:none;border-color:#1860a8;box-shadow:0 0 0 2px rgba(24,96,168,.12)}
.fta{resize:vertical;min-height:60px}
.stg{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.sto{padding:9px 12px;border-radius:7px;border:2px solid transparent;cursor:pointer;font-size:13px;font-weight:600}
.sto:hover{opacity:.85}
.sto.sel{border-color:currentColor!important}
.ecard{background:#fff;border:1px solid #ddd;border-radius:10px;padding:14px 16px;margin-bottom:9px}
.eav{width:38px;height:38px;border-radius:50%;background:#e8f1fb;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;color:#1860a8;flex-shrink:0}
.emrow{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:8px;margin-top:11px;padding-top:11px;border-top:1px solid #eee}
.emlbl{font-size:10px;color:#888;margin-bottom:2px;text-align:center}
.emval{font-size:14px;font-weight:700;text-align:center}
.sec-hdr{font-size:13px;font-weight:700;margin-bottom:8px;margin-top:4px}
.info-bar{background:#e0f4ed;border:1px solid #9fe0cb;border-radius:7px;padding:9px 13px;font-size:13px;color:#074f3c;margin-bottom:15px}
.months-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px}
.month-cell{border-radius:7px;padding:9px 8px;text-align:center;font-size:12px;border:1px solid transparent}
.month-ok{background:#e9f3dc;border-color:#bde090;color:#3a6b10}
.month-miss{background:#faebd8;border-color:#f8c580;color:#834e0a;cursor:pointer}
.month-miss:hover{background:#f5d9b8}
.month-future{background:#f5f3ef;color:#bbb;border-color:#eee}
.month-name{font-weight:700;font-size:13px}
.month-inv{font-size:10px;margin-top:2px;line-height:1.3}
.prog-bar{height:6px;background:#eee;border-radius:3px;margin-top:6px;overflow:hidden}
.prog-fill{height:100%;border-radius:3px;background:#1860a8}
/* Invoice chain */
.inv-chain{margin-bottom:8px}
.inv-chain-main{display:flex;align-items:center;gap:8px;padding:9px 12px;background:#fff;border:1px solid #ddd;border-radius:7px 7px 0 0;font-size:13px}
.inv-chain-sub{display:flex;align-items:center;gap:8px;padding:7px 12px 7px 24px;background:#faf8f5;border:1px solid #ddd;border-top:none;border-radius:0 0 7px 7px;font-size:12px}
.inv-chain-sub.need-tax{background:#faebd8;border-color:#f8c580;color:#5a3200;cursor:pointer}
.inv-chain-sub.need-tax:hover{background:#f5d9b8}
.inv-chain-sub.has-tax{background:#e9f3dc;border-color:#bde090;color:#3a6b10}
.inv-chain-solo{display:flex;align-items:center;gap:8px;padding:9px 12px;background:#fff;border:1px solid #ddd;border-radius:7px;margin-bottom:6px;font-size:13px}
.chain-arrow{color:#bbb;font-size:10px}
/* need-tax badge in main table */
.need-tax-badge{display:inline-flex;align-items:center;gap:3px;background:#faebd8;color:#834e0a;border:1px solid #f8c580;border-radius:4px;font-size:11px;padding:2px 6px;cursor:pointer}
.need-tax-badge:hover{background:#f5d9b8}
/* debts report — filter chips */
.chip{display:inline-flex;align-items:center;gap:5px;padding:5px 11px;border-radius:20px;border:1px solid #ddd;background:#fff;color:#555;font-size:12px;font-weight:600;cursor:pointer;user-select:none}
.chip:hover{background:#f5f3ef}
.chip.on{background:#1860a8;border-color:#1860a8;color:#fff}
.chip-box{background:#fff;border:1px solid #ddd;border-radius:10px;padding:12px 14px;margin-bottom:10px}
.chip-hdr{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.chip-ttl{font-size:12px;font-weight:700;color:#888}
.chip-act{font-size:11px;color:#1860a8;cursor:pointer;font-weight:700}
.chip-wrap{display:flex;flex-wrap:wrap;gap:6px}
.tgl{display:inline-flex;align-items:center;gap:6px;font-size:13px;cursor:pointer;padding:5px 11px;border-radius:7px;border:1px solid #ddd;background:#fff}
.tgl.on{background:#e8f1fb;border-color:#9ec4ea;color:#1860a8;font-weight:700}
@media(max-width:750px){#sb{display:none}#main{margin-right:0}.stats4,.stats3{grid-template-columns:1fr 1fr}.fg2{grid-template-columns:1fr}.fg.w2{grid-column:1}}
</style>
</head>
<body>
<div id="wrap">
<aside id="sb">
  <div class="sb-top"><div class="sb-brand">ארזים הנדסה</div><div class="sb-sub">ניהול פיקוח בנייה</div></div>

  <div class="ni" id="ni-cashflow" onclick="go('cashflow')"><span class="nic">💰</span>תזרים וחייבים<span class="nb" id="b-cf" style="display:none;background:#834e0a">0</span></div>

</aside>
<div id="main">
  <div id="topbar">
    <h2 id="vtitle">לוח בקרה</h2>
    <div id="srch-wrap">
      <input id="gsrch" type="text" placeholder="🔍 שם פרויקט / מספר הזמנה / חשבונית..." autocomplete="off" oninput="doSearch(this.value)" onblur="setTimeout(closeSearch,200)">
      <div id="srch-res"></div>
    </div>
    <span id="sync-badge" style="font-size:11px;color:#888">☁️ טוען...</span><div id="vact"></div>
  </div>

</div>
</div>
<div id="mbg" onclick="bgx(event)"><div class="modal" id="modal" onclick="event.stopPropagation()"></div></div>
<div id="login-bg" style="display:none;position:fixed;inset:0;background:#eeece8;z-index:1000;align-items:center;justify-content:center">
  <div style="background:#fff;border:1px solid #ddd;border-radius:14px;padding:32px;width:340px;max-width:calc(100vw - 30px);box-shadow:0 8px 40px rgba(0,0,0,.1)">
    <div style="font-size:18px;font-weight:700;color:#1860a8;text-align:center">ארזים הנדסה</div>
    <div style="font-size:12px;color:#999;text-align:center;margin-bottom:22px">ניהול פיקוח — כניסה למערכת</div>
    <div class="fg" style="margin-bottom:10px"><label class="flbl">אימייל</label><input class="fi" id="lg-em" type="email" autocomplete="username" value="moshe@arazim-eng.co.il"></div>
    <div class="fg" style="margin-bottom:14px"><label class="flbl">סיסמה</label><input class="fi" id="lg-pw" type="password" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()"></div>
    <button class="btn btn-blue" style="width:100%;justify-content:center;padding:9px" onclick="doLogin()">כניסה</button>
    <div id="lg-err" style="color:#b02;font-size:12px;text-align:center;margin-top:10px;min-height:16px"></div>
  </div>
</div>
<script>
var CL=[{id:'jlm',name:'עיריית ירושלים',ent:'עוסק',col:'#1860a8'},{id:'rl',name:'עיריית ראשון לציון',ent:'עוסק',col:'#3b3387'},{id:'bs',name:'עיריית בית שמש',ent:'חברה',col:'#0e6d54'},{id:'ge',name:'גוש עציון',ent:'עוסק',col:'#834e0a'},{id:'ef',name:'אפרת',ent:'חברה',col:'#933355'},{id:'nc',name:'נס ציונה',ent:'עוסק',col:'#555'},{id:'kg',name:'קרית גת',ent:'עוסק',col:'#555'},{id:'other',name:'אחר',ent:'עוסק',col:'#8a6d3b'}];
var DP={jlm:[{id:'j1',name:'מינהלת העירייה',emp:true},{id:'j2',name:'מנהל חינוך — תכנון',emp:false},{id:'j3',name:'מנהל חינוך — ביצוע/אחר',emp:false},{id:'j4',name:'נגישות ואקוסטיקה',emp:false},{id:'j5',name:'בטיחות חינוך חרדי',emp:false}],rl:[{id:'r1',name:'מחלקת חשמל',emp:true},{id:'r2',name:'מחלקת בינוי',emp:true},{id:'r3',name:'מחלקת שפ"ע',emp:true}],bs:[{id:'b1',name:'כללי',emp:false}],ge:[{id:'g1',name:'כללי',emp:false}],ef:[{id:'e1',name:'כללי',emp:false}],nc:[{id:'n1',name:'כללי',emp:false}],kg:[{id:'k1',name:'כללי',emp:false}],other:[{id:'x1',name:'כללי',emp:false}]};
/* 30.7: every client also gets a free-text "אחר" department — stored as department_id="other:<שם>" */
Object.keys(DP).forEach(function(k){DP[k].push({id:'other',name:'אחר — הקלד שם',emp:false});});
var STS={no_order:{l:'ללא הזמנה',c:'#888',bg:'#f1f0ec'},pending_order:{l:'ממתין להזמנה',c:'#834e0a',bg:'#faebd8'},offer_sent:{l:'נשלח חשבון עסקה',c:'#1860a8',bg:'#e8f1fb'},accounting:{l:'בהנה"ח עירייה',c:'#0e6d54',bg:'#e0f4ed'},paid:{l:'שולם',c:'#3a6b10',bg:'#e9f3dc'},invoice_sent:{l:'נשלחה חשבונית מס',c:'#3b3387',bg:'#eeedfd'},closed:{l:'סגור',c:'#555',bg:'#f1f0ec'}};
var IT=['חשבון עסקה','חשבונית מס','קבלה']; /* 21.7: הצעת מחיר הוסרה — משה לא רוצה אותן בטבלה */
var IST={draft:{l:'טיוטה',c:'#888',bg:'#f1f0ec'},sent:{l:'נשלח',c:'#1860a8',bg:'#e8f1fb'},accounting:{l:'בהנה"ח',c:'#834e0a',bg:'#faebd8'},paid:{l:'שולם',c:'#3a6b10',bg:'#e9f3dc'},cancelled:{l:'מבוטל',c:'#b02',bg:'#fce9e9'}};
var MONTHS=['ינואר','פברואר','מרץ','אפריל','מאי','יוני','יולי','אוגוסט','ספטמבר','אוקטובר','נובמבר','דצמבר'];
var PFCAT=['הזמנת עבודה','חשבון מאושר','הצעת מחיר','כתב כמויות','חשבונית קבלן','אחר'];
/* client numbering codes — position in CL determines 2-digit code (01..) */
function clientCode(cid){for(var i=0;i<CL.length;i++)if(CL[i].id===cid)return ('0'+(i+1)).slice(-2);return '00';}
function projById(pid){for(var j=0;j<D.projects.length;j++)if(D.projects[j].id===pid)return D.projects[j];return null;}
function hasWO(p){return !!(p&&String(p.work_order_number||'').trim());}
function projYear(p){var d=p&&p.created_at?new Date(p.created_at):new Date();return d.getFullYear();}
/* next running serial for a client+year → e.g. 2026-01-0003 */
function nextProjNumber(cid,year){var pre=year+'-'+clientCode(cid)+'-';var mx=0;D.projects.forEach(function(p){if(p.project_number&&p.project_number.indexOf(pre)===0){var n=parseInt(p.project_number.slice(pre.length),10);if(!isNaN(n)&&n>mx)mx=n;}});return pre+('000'+(mx+1)).slice(-4);}
function backfillProjNumbers(){
  if(!confirm('להקצות מספר לכל הפרויקטים שעדיין ללא מספר? (לפי שנת יצירה ולקוח)'))return;
  var counters={};var updated=[];
  D.projects.slice().sort(function(a,b){return new Date(a.created_at||0)-new Date(b.created_at||0);}).forEach(function(p){
    if(p.project_number)return;
    var y=projYear(p);var key=y+'-'+clientCode(p.client_id);
    if(counters[key]===undefined){var pre0=key+'-';var mx=0;D.projects.forEach(function(q){if(q.project_number&&q.project_number.indexOf(pre0)===0){var n=parseInt(q.project_number.slice(pre0.length),10);if(!isNaN(n)&&n>mx)mx=n;}});counters[key]=mx;}
    counters[key]++;
    p.project_number=key+'-'+('000'+counters[key]).slice(-4);p.updated_at=new Date().toISOString();updated.push(p);
  });
  if(!updated.length){alert('לכל הפרויקטים כבר יש מספר.');return;}
  svP();updated.forEach(function(p){cloudSave('projects',p);});go(D.view);
  alert('הוקצו מספרים ל-'+updated.length+' פרויקטים.');
}

function afetch(url,opts){

    opts.headers=Object.assign({},opts.headers||{},{'Authorization':'Bearer '+SESS.access_token,'apikey':SB_KEY});

      if(r.status===401){return refreshSess().then(function(){opts.headers['Authorization']='Bearer '+SESS.access_token;return fetch(url,opts);});}

/* CASHFLOW SET: what money is genuinely expected.

   excluded = עסקה ללא הזמנה (speculative), הצעת מחיר/קבלה, and anything flagged exclude_cashflow. */
function invCertain(i){return i.invoice_type==='חשבונית מס';}
function inCashflow(i){
  if(i.exclude_cashflow)return false;
  if(!(i.status==='sent'||i.status==='accounting'))return false;
  if(!Number(i.amount))return false;
  if(i.invoice_type==='חשבונית מס')return true;

/* MONEY RULE: only חשבונית מס counts as real revenue. חשבון עסקה is a request, tracked separately. */
function projFin(pid,p){
  var invs=pInvs(pid);
  var tax=invs.filter(function(i){return i.invoice_type==='חשבונית מס';});
  var sub=asum(tax,'amount');
  var paid=asum(tax.filter(function(i){return i.status==='paid';}),'amount');
  var pend=asum(tax.filter(function(i){return i.status==='sent'||i.status==='accounting';}),'amount');
  /* open חשבונות עסקה = not yet closed by a tax invoice */
  var openPf=invs.filter(function(i){return i.invoice_type==='חשבון עסקה'&&!chainCloser(i.id);});
  var pfOpenSent=asum(openPf.filter(function(i){return i.status==='sent'||i.status==='accounting';}),'amount');
  var pfPaidNeedsTax=asum(openPf.filter(function(i){return i.status==='paid';}),'amount');
  var wo=hasWO(p);
  var base={sub:sub,paid:paid,pend:pend,cnt:tax.length,invCnt:invs.length,pfOpenSent:pfOpenSent,pfPaidNeedsTax:pfPaidNeedsTax,pfCnt:openPf.length,wo:wo};
  if(p&&p.project_type==='contract'){
    var rate=Number(p.contract_hourly_rate)||0;var hrs=Number(p.contract_avg_hours)||0;
    base.isContract=true;base.monthly=rate*hrs;base.rate=rate;base.hrs=hrs;return base;
  }
  var supervAmt=p?Number(p.supervision_amount)||0:0;
  base.isContract=false;base.rem=supervAmt-sub;return base;
}

function contractMonths(p){if(!p.contract_start||!p.contract_end)return[];var months=[];var s=new Date(p.contract_start);var e=new Date(p.contract_end);var cur=new Date(s.getFullYear(),s.getMonth(),1);var now=new Date();while(cur<=e){var y=cur.getFullYear(),m=cur.getMonth();var mi=pInvs(p.id).filter(function(inv){if(!inv.date_sent)return false;var d=new Date(inv.date_sent);return d.getFullYear()===y&&d.getMonth()===m;});months.push({y:y,m:m,invs:mi,future:cur>now});cur=new Date(y,m+1,1);}return months;}

    var woM=(p.work_order_number||'').toLowerCase().indexOf(lq)>=0;

  });

    if((i.invoice_number||'').toLowerCase().indexOf(lq)>=0||(i.invoice_type||'').toLowerCase().indexOf(lq)>=0||(i.notes||'').toLowerCase().indexOf(lq)>=0){
      var p=null;for(var j=0;j<D.projects.length;j++)if(D.projects[j].id===i.project_id){p=D.projects[j];break;}
      invs.push({type:'inv',id:i.id,pid:i.project_id,main:(i.invoice_type||'')+(i.invoice_number?' #'+i.invoice_number:''),sub:p?p.name:'',amt:i.amount,status:i.status});

/* an invoice is "late" only from the day AFTER its due date — not at 00:00 of the due date itself */
function todayMidnight(){var t=new Date();return new Date(t.getFullYear(),t.getMonth(),t.getDate());}
function isLate(dd){return !!(dd&&dd<todayMidnight());}
function lateDays(dd){return dd?Math.round((todayMidnight()-dd)/86400000):0;}

function unassigned(){return D.invoices.filter(function(i){return !i.project_id&&i.invoice_type!=='הצעת מחיר';});}

/* ── HANDLERS (גורמים מטפלים) ── */
function normHandler(v){return String(v||'').trim().replace(/\s+/g,' ');}
/* every handler we know of — from projects AND manually added rows in the handlers table */
function handlersList(){
  var seen={},out=[];
  D.projects.forEach(function(p){var n=normHandler(p.contact_name);if(!n)return;var k=n.toLowerCase();if(!seen[k]){seen[k]=1;out.push(n);}});
  D.handlers.forEach(function(h){var n=normHandler(h.name);if(!n)return;var k=n.toLowerCase();if(!seen[k]){seen[k]=1;out.push(n);}});
  return out.sort(function(a,b){return a.localeCompare(b,'he');});
}

  (navigator.clipboard&&navigator.clipboard.writeText?navigator.clipboard.writeText(t):Promise.reject()).then(function(){alert('הסיכום הועתק — אפשר להדביק בוואטסאפ/מייל');}).catch(function(){prompt('העתק ידנית:',t);});
}
/* ── handler weekly-email settings (handlers table) ── */
/* a handler may hold MORE THAN ONE address — e.g. "תהילה + קובי" (פלך) goes to both of them.
   stored comma-separated in handlers.email; every send splits it back into individual recipients. */
function splitEmails(v){return String(v||'').split(/[,;\s]+/).map(function(s){return s.trim();}).filter(Boolean);}
function emailsValid(v){var a=splitEmails(v),re=/^[^@\s]+@[^@\s]+\.[^@\s]+$/;for(var i=0;i<a.length;i++)if(!re.test(a[i]))return false;return true;}
function joinEmails(v){return splitEmails(v).join(', ');}
function handlerRec(name){var k=normHandler(name).toLowerCase();for(var i=0;i<D.handlers.length;i++)if(normHandler(D.handlers[i].name).toLowerCase()===k)return D.handlers[i];return null;}
function saveHandlerEmail(name,elId){
  var em=(document.getElementById('he-'+elId)||{value:''}).value.trim();
  var wk=(document.getElementById('hw-'+elId)||{checked:true}).checked;
  if(em&&!emailsValid(em)){alert('כתובת מייל לא תקינה — אפשר כמה כתובות מופרדות בפסיק');return;}
  em=joinEmails(em);
  var h=handlerRec(name);
  if(!h){h={id:uid(),name:normHandler(name),created_at:new Date().toISOString()};D.handlers.push(h);}
  h.email=em||null;h.send_weekly=wk;h.updated_at=new Date().toISOString();
  localStorage.setItem('az_h',JSON.stringify(D.handlers));
  cloudSave('handlers',h);
  var st=document.getElementById('hs-'+elId);if(st){st.textContent='✓ נשמר';setTimeout(function(){if(st)st.textContent='';},2000);}
}

/* ══ DEBTS REPORT (דוח חובות) — pick municipalities + handlers, export to Excel/PDF, email ══ */
function js1(s){return String(s===undefined||s===null?'':s).replace(/\\/g,'\\\\').replace(/'/g,"\\'");}
function projClientKey(p){return p&&p.client_id==='other'?('other:'+normHandler(p.custom_client||'')):((p&&p.client_id)||'');}
function clientKeyName(k){k=String(k||'');if(k.indexOf('other:')===0)return k.slice(6)||'לקוח אחר';var c=gc(k);return c.name||k||'—';}
function handlerKeyOf(p){return normHandler(p&&p.contact_name).toLowerCase()||'__none';}
function dbtSel(t){var o=D.dbt[t]||{};return Object.keys(o).filter(function(k){return o[k];});}
function dbtClientOpts(){
  var m={};
  D.projects.forEach(function(p){var k=projClientKey(p);if(!k)return;if(!m[k])m[k]={k:k,name:clientKeyName(k),col:gc(p.client_id).col||'#888'};});
  return Object.keys(m).map(function(k){return m[k];}).sort(function(a,b){return a.name.localeCompare(b.name,'he');});
}
function dbtHandlerOpts(){
  var selC=dbtSel('cls'),m={};
  D.projects.forEach(function(p){
    if(selC.length&&selC.indexOf(projClientKey(p))<0)return;
    var k=handlerKeyOf(p);
    if(!m[k])m[k]={k:k,name:normHandler(p.contact_name)||'ללא גורם מטפל',n:0};
    m[k].n++;
  });
  if(!selC.length)D.handlers.forEach(function(hh){var n=normHandler(hh.name);if(!n)return;var k=n.toLowerCase();if(!m[k])m[k]={k:k,name:n,n:0};});
  return Object.keys(m).map(function(k){return m[k];}).sort(function(a,b){return a.name.localeCompare(b.name,'he');});
}
function dbtTog(t,k){D.dbt[t][k]=!D.dbt[t][k];if(t==='cls')D.dbt.hns={};document.getElementById('view').innerHTML=vDebts();}
function dbtAll(t){var o={};(t==='cls'?dbtClientOpts():dbtHandlerOpts()).forEach(function(x){o[x.k]=true;});D.dbt[t]=o;document.getElementById('view').innerHTML=vDebts();}
function dbtClear(t){D.dbt[t]={};document.getElementById('view').innerHTML=vDebts();}
function dbtInc(f){D.dbt[f]=!D.dbt[f];document.getElementById('view').innerHTML=vDebts();}
/* build the report data set. `over` = {cls:[],hns:[]} to override the on-screen selection (used for per-handler emails) */
function debtData(over){
  var selC=over&&over.cls?over.cls:dbtSel('cls');
  var selH=over&&over.hns?over.hns:dbtSel('hns');
  var okP=function(p){
    if(!p)return false;
    if(selC.length&&selC.indexOf(projClientKey(p))<0)return false;
    if(selH.length&&selH.indexOf(handlerKeyOf(p))<0)return false;
    return true;
  };
  var orders=[],invs=[],today=new Date();
  if(D.dbt.noOrd){
    D.projects.forEach(function(p){
      if(p.status!=='no_order'&&p.status!=='pending_order')return;
      if(!okP(p))return;
      orders.push({p:p,client:cliName(p)||clientKeyName(projClientKey(p)),dept:gd(p.client_id,p.department_id).name||'—',
        handler:normHandler(p.contact_name)||'—',scope:Number(p.scope_amount)||0,net:Number(p.supervision_amount)||0,
        st:p.status==='pending_order'?'הובטחה הזמנה — טרם הוצאה':'ממתין להזמנת עבודה'});
    });
  }
  if(D.dbt.unpaid){
    cashflowInvs().forEach(function(i){
      var p=projById(i.project_id);
      if(p){if(!okP(p))return;}
      else if(selC.length||selH.length)return;
      var dd=dueDate(i),late=isLate(dd);
      invs.push({i:i,p:p,client:p?cliName(p):'ללא שיוך לפרויקט',handler:p?(normHandler(p.contact_name)||'—'):'—',
        proj:p?p.name:'⚠️ ללא שיוך',amt:Number(i.amount)||0,due:dd,late:late,
        days:lateDays(dd),cert:invCertain(i)});
    });
  }
  orders.sort(function(a,b){return a.client.localeCompare(b.client,'he')||b.net-a.net;});
  invs.sort(function(a,b){return (a.due||0)-(b.due||0);});
  return{orders:orders,invs:invs,ordSum:orders.reduce(function(s,r){return s+r.net;},0),invSum:invs.reduce(function(s,r){return s+r.amt;},0)};
}
function dbtScopeLabel(){
  var c=dbtSel('cls'),hn=dbtSel('hns');
  var cs=c.length?c.map(clientKeyName).join(', '):'כל הרשויות';
  var hs=hn.length?(' · '+hn.map(dbtHandlerName).join(', ')):'';
  return cs+hs;
}
function dbtHandlerName(k){var o=dbtHandlerOpts();for(var i=0;i<o.length;i++)if(o[i].k===k)return o[i].name;
  for(var j=0;j<D.projects.length;j++)if(handlerKeyOf(D.projects[j])===k)return normHandler(D.projects[j].contact_name)||'ללא גורם מטפל';
  return k==='__none'?'ללא גורם מטפל':k;}
/* ── חבילת מסמכים (PACK) — כל מה שצריך כדי להוציא הזמנה / לאשר חשבון, פר חשבון או פר פרויקט.
   נשמר ב-invoices.pack / projects.pack (jsonb): {slots:[{k,label,req,files:[{id,name,path,at}]}]}.
   משבצת "quote" של חשבון מסתפקת אוטומטית ב-file_url של החשבון עצמו. */
var PACK_SLOTS=[
  {k:'quote',label:'הצעת מחיר / חשבון עסקה',req:true},
  {k:'acc',label:'חשבון קבלן חתום',req:true},
  {k:'boq',label:'כתב כמויות חתום',req:false},
  {k:'cinv',label:'חשבונית קבלן',req:true}];
function invById(iid){for(var i=0;i<D.invoices.length;i++)if(D.invoices[i].id===iid)return D.invoices[i];return null;}
function packEnt(kind,id){return kind==='i'?invById(id):projById(id);}
function getPack(kind,id){
  var e=packEnt(kind,id);if(!e)return null;
  if(!e.pack||!e.pack.slots)e.pack={slots:PACK_SLOTS.map(function(s){return{k:s.k,label:s.label,req:s.req,files:[]};})};
  return e.pack;
}
function savePack(kind,id){
  var e=packEnt(kind,id);if(!e)return;
  if(kind==='i')svI();else svP();
  afetch(SB_URL+'/rest/v1/'+(kind==='i'?'invoices':'projects')+'?id=eq.'+encodeURIComponent(id),{method:'PATCH',headers:{'Content-Type':'application/json','Prefer':'return=minimal'},body:JSON.stringify({pack:e.pack})})
  .then(function(r){showSync(r.ok,r.ok?null:'שמירת חבילה נכשלה');}).catch(function(){showSync(false,'שמירת חבילה נכשלה');});
}
/* מסמכים שכבר שמורים בתיק הפרויקט נספרים אוטומטית בחבילה, לפי קטגוריה */
var PACK_PFMAP={'הצעת מחיר':'quote','חשבון מאושר':'acc','כתב כמויות':'boq','חשבונית קבלן':'cinv'};
function packProjFiles(kind,e,slotK){
  var p=kind==='i'?projById(e.project_id):e;
  if(!p||!p.files)return[];
  return p.files.filter(function(f){return PACK_PFMAP[f.cat||'']===slotK;});
}
function packSlotOk(kind,e,s){if(s.files&&s.files.length)return true;if(packProjFiles(kind,e,s.k).length)return true;return s.k==='quote'&&kind==='i'&&!!e.file_url;}
function packStat(kind,id){
  var e=packEnt(kind,id);if(!e)return{done:0,total:0};
  var slots=(e.pack&&e.pack.slots)?e.pack.slots:PACK_SLOTS.map(function(s){return{k:s.k,label:s.label,req:s.req,files:[]};});
  var req=slots.filter(function(s){return s.req;});
  return{done:req.filter(function(s){return packSlotOk(kind,e,s);}).length,total:req.length};
}

function packDelSlot(kind,id,ix){

function packDelFile(kind,id,ix,fid){

/* ── שיתוף חבילה לגורם בעירייה: טוקן אקראי בטבלת pack_shares → דף ציבורי ב-edge fn pack-share ── */
function packHasDocs(kind,id){
  var e=packEnt(kind,id);if(!e)return false;
  if(kind==='i'&&e.file_url)return true;
  var p=kind==='i'?projById(e.project_id):e;
  if(p&&p.files&&p.files.some(function(f){return PACK_PFMAP[f.cat||''];}))return true;
  var pk=e.pack&&e.pack.slots?e.pack:null;if(!pk)return false;
  for(var i=0;i<pk.slots.length;i++)if(pk.slots[i].files&&pk.slots[i].files.length)return true;
  return false;
}
function packToken(){var a=new Uint8Array(20);crypto.getRandomValues(a);var s='';for(var i=0;i<a.length;i++)s+=('0'+a[i].toString(16)).slice(-2);return s;}
function packShareUrl(t){return SB_URL+'/functions/v1/pack-share?t='+t;}
/* create fresh 30-day share tokens for every debt row that has documents; resolves to {'<kind>:<id>':url} */
function makePackShares(d,days){
  var rows=[];
  d.orders.forEach(function(r){if(packHasDocs('p',r.p.id))rows.push({kind:'p',id:r.p.id});});
  d.invs.forEach(function(r){if(packHasDocs('i',r.i.id))rows.push({kind:'i',id:r.i.id});});
  if(!rows.length)return Promise.resolve({});
  var exp=new Date(Date.now()+(days||30)*864e5).toISOString();
  var recs=rows.map(function(x){return{token:packToken(),kind:x.kind,ref_id:x.id,expires_at:exp};});
  return sbUpsert('pack_shares',recs).then(function(){
    var m={};recs.forEach(function(r){m[r.kind+':'+r.ref_id]=packShareUrl(r.token);});return m;
  });
}
function packShare(kind,id){
  var t=packToken();
  sbUpsert('pack_shares',[{token:t,kind:kind,ref_id:id,expires_at:new Date(Date.now()+30*864e5).toISOString()}])
  .then(function(){
    var url=packShareUrl(t);
    var done=function(){alert('🔗 הקישור הועתק — אפשר להדביק בוואטסאפ/מייל לגורם.\nבתוקף 30 יום, בלי צורך בסיסמה:\n\n'+url);};
    if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(url).then(done,function(){prompt('העתק את הקישור (בתוקף 30 יום):',url);});
    else prompt('העתק את הקישור (בתוקף 30 יום):',url);
  });
}
/* רשימת המסמכים הנדרשים שחסרים בחבילה */
function packMissing(kind,id){
  var e=packEnt(kind,id);if(!e)return[];
  var slots=(e.pack&&e.pack.slots)?e.pack.slots:PACK_SLOTS.map(function(s){return{k:s.k,label:s.label,req:s.req,files:[]};});
  return slots.filter(function(s){return s.req&&!packSlotOk(kind,e,s);}).map(function(s){return s.label;});
}
/* חשבונות כפולים: אותו פרויקט + אותו סכום, או אותו מספר מסמך, בין הפתוחים */
function dbtDups(d){
  var seen={},dup={};
  d.invs.forEach(function(r){var i=r.i;
    var ks=[];
    if(Number(i.amount))ks.push('a:'+(i.project_id||'~')+':'+Number(i.amount));
    if(i.invoice_number)ks.push('n:'+(i.project_id||'~')+':'+String(i.invoice_number).trim());
    ks.forEach(function(k){if(seen[k]&&seen[k]!==i.id){dup[i.id]=1;dup[seen[k]]=1;}else seen[k]=i.id;});
  });
  return dup;
}
/* טבלת "מה חסר" — שורות החוב שהחבילה שלהן לא שלמה או שהן חשודות ככפולות */
function dbtGaps(d){
  var dups=dbtDups(d),rows=[];
  d.orders.forEach(function(r){
    var miss=packMissing('p',r.p.id);
    if(miss.length)rows.push({client:r.client,proj:r.p.name,doc:'להזמנת עבודה',num:r.p.project_number||'—',miss:miss,dup:false,kind:'p',id:r.p.id});
  });
  d.invs.forEach(function(r){
    var miss=packMissing('i',r.i.id);
    var isDup=!!dups[r.i.id];
    if(miss.length||isDup)rows.push({client:r.client,proj:r.proj,doc:(r.i.invoice_type||'')+' '+(r.i.invoice_number||''),num:r.i.invoice_number||'—',miss:miss,dup:isDup,kind:'i',id:r.i.id});
  });
  return rows;
}
/* sign a storage path → temporary URL (legacy full-http refs are returned as-is) */
function signURL(ref){
  if(!ref)return Promise.resolve(null);
  if(ref.indexOf('http')===0)return Promise.resolve(ref);
  return afetch(SB_URL+'/storage/v1/object/sign/invoices/'+ref.split('/').map(encodeURIComponent).join('/'),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({expiresIn:3600})})
  .then(function(r){return r.json();}).then(function(d){return d.signedURL?SB_URL+'/storage/v1'+d.signedURL:null;}).catch(function(){return null;});
}
var _pdfLibLoading=null;
function loadPdfLib(){
  if(window.PDFLib)return Promise.resolve();
  if(_pdfLibLoading)return _pdfLibLoading;
  _pdfLibLoading=new Promise(function(res,rej){var sc=document.createElement('script');sc.src='https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js';sc.onload=res;sc.onerror=function(){_pdfLibLoading=null;rej(new Error('טעינת ספריית PDF נכשלה'));};document.head.appendChild(sc);});
  return _pdfLibLoading;
}
function packImgPage(out,img){var pg=out.addPage([595,842]);var sc=Math.min(555/img.width,802/img.height,1);pg.drawImage(img,{x:(595-img.width*sc)/2,y:(842-img.height*sc)/2,width:img.width*sc,height:img.height*sc});}
function packMerge(kind,id){
  var e=packEnt(kind,id),pk=getPack(kind,id);if(!e)return;
  var items=[];
  pk.slots.forEach(function(s){
    if(s.k==='quote'&&kind==='i'&&e.file_url&&!(s.files&&s.files.length))items.push({ref:e.file_url});
    packProjFiles(kind,e,s.k).forEach(function(f){items.push({ref:f.path});});
    (s.files||[]).forEach(function(f){items.push({ref:f.path});});
  });
  if(!items.length){alert('אין עדיין קבצים בחבילה');return;}
  var btn=document.getElementById('pack-dl');if(btn){btn.disabled=true;btn.textContent='⏳ בונה חבילה...';}
  var skipped=0;
  loadPdfLib().then(function(){return PDFLib.PDFDocument.create();}).then(function(out){
    var chain=Promise.resolve();
    items.forEach(function(it){
      chain=chain.then(function(){
        return signURL(it.ref)
        .then(function(u){if(!u)return null;return fetch(u).then(function(r){return r.ok?r.arrayBuffer():null;}).catch(function(){return null;});})
        .then(function(buf){
          if(!buf){skipped++;return;}
          var lo=String(it.ref).toLowerCase().split('?')[0];
          if(/\.png$/.test(lo))return out.embedPng(buf).then(function(img){packImgPage(out,img);}).catch(function(){skipped++;});
          if(/\.jpe?g$/.test(lo))return out.embedJpg(buf).then(function(img){packImgPage(out,img);}).catch(function(){skipped++;});
          return PDFLib.PDFDocument.load(buf,{ignoreEncryption:true})
            .then(function(src){return out.copyPages(src,src.getPageIndices());})
            .then(function(pgs){pgs.forEach(function(pg){out.addPage(pg);});})
            .catch(function(){skipped++;});
        });
      });
    });
    return chain.then(function(){if(!out.getPageCount())throw new Error('אף קובץ לא ניתן לצירוף (ייתכן שמדובר בקבצים חיצוניים או פורמט לא נתמך)');return out.save();});
  }).then(function(bytes){
    var blob=new Blob([bytes],{type:'application/pdf'});
    var a=document.createElement('a');a.href=URL.createObjectURL(blob);
    a.download='חבילת מסמכים - '+packTitle(kind,id).replace(/[\/\\:*?"<>|]/g,'-')+'.pdf';
    document.body.appendChild(a);a.click();a.remove();
    if(btn){btn.disabled=false;btn.textContent='🖨️ הורד חבילה מאוחדת (PDF)';}
    if(skipped)alert(skipped+' קבצים דולגו (קובץ חיצוני או פורמט שאינו PDF/תמונה) — הם עדיין זמינים לצפייה בנפרד');
  }).catch(function(er){
    if(btn){btn.disabled=false;btn.textContent='🖨️ הורד חבילה מאוחדת (PDF)';}
    alert('שגיאה בבניית החבילה: '+er.message);
  });
}

function loadXLSX(cb){
  if(window.XLSX)return cb();
  var srcs=['https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js','https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js'];
  var i=0;
  (function next(){
    if(i>=srcs.length){alert('לא ניתן לטעון את מנוע האקסל — בדוק חיבור לאינטרנט');return;}
    var s=document.createElement('script');s.src=srcs[i++];
    s.onload=function(){window.XLSX?cb():next();};s.onerror=next;
    document.head.appendChild(s);
  })();
}

      d.orders.forEach(function(r){a.push([r.client,r.handler,r.p.project_number||'',r.p.name||'',r.dept,r.scope||'',r.net,withVat(r.net),r.st]);});
      a.push(['','','','','סה"כ ('+d.orders.length+')','',d.ordSum,withVat(d.ordSum),'']);
      add('ממתין להזמנת עבודה',a,[20,16,14,34,20,20,20,14,24]);

      d.invs.forEach(function(r){b.push([r.client,r.handler,r.proj,r.i.invoice_type||'',r.i.invoice_number||'',fd(invBaseDate(r.i)),r.due?fd(r.due):'',r.late?r.days:'',r.amt]);});
      b.push(['','','','','','','סה"כ ('+d.invs.length+')','',d.invSum]);
      add('הוגש וטרם שולם',b,[20,16,34,14,14,14,20,10,14]);
    }
    /* summary by client × handler */
    var m={};
    d.orders.forEach(function(r){var k=r.client+'|'+r.handler;if(!m[k])m[k]={c:r.client,h:r.handler,oc:0,os:0,ic:0,is:0};m[k].oc++;m[k].os+=r.net;});
    d.invs.forEach(function(r){var k=r.client+'|'+r.handler;if(!m[k])m[k]={c:r.client,h:r.handler,oc:0,os:0,ic:0,is:0};m[k].ic++;m[k].is+=r.amt;});
    var s=[['רשות','גורם מטפל','פרויקטים ללא הזמנה','סכום ממתין להזמנה','חשבונות פתוחים','סכום טרם שולם','סה"כ חשיפה']];
    Object.keys(m).sort().forEach(function(k){var x=m[k];s.push([x.c,x.h,x.oc,x.os,x.ic,x.is,x.os+x.is]);});
    s.push(['סה"כ','',d.orders.length,d.ordSum,d.invs.length,d.invSum,d.ordSum+d.invSum]);
    add('סיכום',s,[22,18,18,20,16,18,16]);
    var fn='דוח חובות — '+dbtScopeLabel().replace(/[\\\/:*?"<>|]/g,' ').slice(0,60)+' — '+new Date().toLocaleDateString('he-IL')+'.xlsx';
    XLSX.writeFile(wb,fn);
  });

function dbtSend(msgs,btnId){
  var btn=btnId?document.getElementById(btnId):null;
  if(btn){btn.disabled=true;btn.textContent='שולח...';}
  return afetch(SB_URL+'/functions/v1/debt-mail',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:msgs})})
  .then(function(r){return r.json();})
  .then(function(res){
    if(res.ok)alert('✅ נשלחו '+(res.sent||0)+' מיילים'+(res.errors&&res.errors.length?('\n⚠️ שגיאות: '+res.errors.join(', ')):''));
    else alert('שגיאה בשליחה: '+(res.error||''));
  })
  .catch(function(){alert('שגיאה בחיבור לשרת המייל');})
  .finally(function(){go('debts');});
}

function dbtMailHandlers(){
  var selH=dbtSel('hns'),selC=dbtSel('cls');
  if(!selH.length){alert('בחר קודם גורם/ים מטפלים — כדי לא לשלוח בטעות לכולם');return;}
  var entries=[],missing=[],empty=[],lines=[];
  selH.forEach(function(k){
    if(k==='__none')return;
    var name=dbtHandlerName(k);
    var rec=handlerRec(name);
    var addrs=rec?splitEmails(rec.email):[];
    if(!addrs.length){missing.push(name);return;}
    var d=debtData({cls:selC,hns:[k]});
    if(!d.orders.length&&!d.invs.length){empty.push(name);return;}
    entries.push({name:name,addrs:addrs,d:d});
    lines.push('• '+name+' → '+addrs.join(' + ')+'  ('+d.orders.length+' ללא הזמנה, '+d.invs.length+' לא שולמו, '+fc(d.ordSum+d.invSum)+')');
  });
  var warn='';
  if(missing.length)warn+='\n⚠️ ללא מייל (לא יישלח): '+missing.join(', ');
  if(empty.length)warn+='\nℹ️ אין להם חובות פתוחים: '+empty.join(', ');
  if(!entries.length){alert('אין למי לשלוח.'+warn);return;}
  if(!confirm('לשלוח '+entries.length+' מיילים ישירות לגורמים בעירייה?\n\n'+lines.join('\n')+'\n\nכל שורה עם מסמכים תכלול קישור 📦 לחבילה (בתוקף 30 יום).\nהמייל יישלח מ-moshe@arazim-eng.co.il.'+warn))return;
  var msgs=[],chain=Promise.resolve();
  entries.forEach(function(en){
    chain=chain.then(function(){return makePackShares(en.d,30);}).then(function(links){
      msgs.push({to:en.addrs,subject:'ריכוז פרויקטים וחשבונות פתוחים — '+en.name+' · '+fc(en.d.ordSum+en.d.invSum),
        html:dbtDocHtml(en.d,{title:'ריכוז פתוחים — '+en.name,greeting:en.name,forHandler:true,packLinks:links})});
    });
  });
  chain.then(function(){dbtSend(msgs);});
}

function fv(id){return parseFloat((document.getElementById(id)||{value:''}).value)||0;}
function fset(id,v){var el=document.getElementById(id);if(el)el.value=v?String(v):'';}
function scChanged(){var s=fv('p-sc');fset('p-scv',s?Math.round(s*(1+VAT)):'');calcS();}
function scvChanged(){var v=fv('p-scv');fset('p-sc',v?Math.round(v/(1+VAT)*100)/100:'');calcS();}
function amChanged(){var a=fv('p-am');fset('p-amv',a?Math.round(a*(1+VAT)):'');}
function amvChanged(){var v=fv('p-amv');fset('p-am',v?Math.round(v/(1+VAT)*100)/100:'');}
function calcS(){var s=fv('p-sc'),pc=fv('p-pc');if(s&&pc){fset('p-am',Math.round(s*pc/100*100)/100);}amChanged();}
function calcContMonthly(){var r=parseFloat(document.getElementById('p-chr')||{value:0}).value||0,h=parseFloat(document.getElementById('p-cah')||{value:0}).value||0;var el=document.getElementById('p-cm-calc');if(el)el.textContent=fc(r*h)+'/חודש';}

function svP2(pid){
  var nm=document.getElementById('p-nm').value.trim();if(!nm){alert('נא להזין שם פרויקט');return;}
  var ptype=document.getElementById('p-type').value;
  var cid=document.getElementById('p-cl').value;
  var cco=(document.getElementById('p-cco')||{value:''}).value.trim();
  if(cid==='other'&&!cco){alert('בחרת לקוח "אחר" — נא להקליד את שם הלקוח');return;}
  var did=document.getElementById('p-d').value;
  if(did==='other'){var dco=(document.getElementById('p-dco')||{value:''}).value.trim();if(!dco){alert('בחרת מחלקה "אחר" — נא להקליד את שם המחלקה');return;}did='other:'+dco;}
  var data={client_id:cid,custom_client:cid==='other'?cco:null,department_id:did,name:nm,contact_name:normHandler(document.getElementById('p-co').value),entity:document.getElementById('p-en').value,project_type:ptype,work_order_number:document.getElementById('p-wo').value.trim(),status:document.getElementById('p-st').value,notes:document.getElementById('p-nt').value.trim(),updated_at:new Date().toISOString()};
  if(ptype==='regular'){data.scope_amount=parseFloat(document.getElementById('p-sc').value)||null;data.supervision_pct=parseFloat(document.getElementById('p-pc').value)||null;data.supervision_amount=parseFloat(document.getElementById('p-am').value)||null;}
  else{data.contract_start=document.getElementById('p-cs').value||null;data.contract_end=document.getElementById('p-ce').value||null;data.contract_hourly_rate=parseFloat(document.getElementById('p-chr').value)||null;data.contract_avg_hours=parseFloat(document.getElementById('p-cah').value)||null;data.supervision_amount=null;}
  if(pid){for(var i=0;i<D.projects.length;i++)if(D.projects[i].id===pid){D.projects[i]=Object.assign({},D.projects[i],data);break;}}
  else{data.id=uid();data.created_at=new Date().toISOString();data.project_number=nextProjNumber(data.client_id,new Date().getFullYear());data.files=[];D.projects.push(data);}
  svP();var _pd=pid?D.projects.filter(function(x){return x.id===pid;})[0]:D.projects[D.projects.length-1];if(_pd)cloudSave('projects',_pd);closeM();go(D.view);
}
function delP(pid,fromM){var p=null;for(var i=0;i<D.projects.length;i++)if(D.projects[i].id===pid){p=D.projects[i];break;}if(!p||!confirm('למחוק "'+p.name+'"?'))return;D.projects=D.projects.filter(function(x){return x.id!==pid;});svP();cloudDel('projects',pid);closeM();go('projects');}

  else{data.submitted_to_muni=false;data.muni_submit_date=null;}

  else{data.id=uid();data.created_at=new Date().toISOString();D.invoices.push(data);}
  svI();var _id2=iid?D.invoices.filter(function(x){return x.id===iid;})[0]:D.invoices[D.invoices.length-1];if(_id2)cloudSave('invoices',_id2);closeM();go(D.view);
}
function delI(iid,fromM){if(!confirm('למחוק חשבונית זו?'))return;D.invoices=D.invoices.filter(function(x){return x.id!==iid;});svI();cloudDel('invoices',iid);closeM();go(D.view);}
/* ── CONVERT חשבון עסקה → חשבונית מס (money received) ── */
function convertToTax(taId){
  var ta=null;for(var i=0;i<D.invoices.length;i++)if(D.invoices[i].id===taId){ta=D.invoices[i];break;}
  if(!ta)return;
  var p=projById(ta.project_id);var today=new Date().toISOString().slice(0,10);
  var h='<div class="mhdr"><span class="mtitle">💰 התקבל תשלום → חשבונית מס</span><button class="mx" onclick="closeM()">✕</button></div>';
  h+='<div class="info-bar" style="background:#e8f1fb;border-color:#cfe2f5;color:#1c4f80">חשבון עסקה <strong>'+ex(ta.invoice_number||'—')+'</strong> על סך '+fc(ta.amount)+(p?' · '+ex(p.name):'')+'.<br>מלא את הסכום שהתקבל <strong>בפועל</strong> (לפעמים העירייה מאשרת פחות). החשבונית מס תיווצר כ<strong>"שולם"</strong> — לא כהמתנה לתשלום.</div>';
  h+='<div class="fg2">';
  h+='<div class="fg"><label class="flbl">מספר חשבונית מס</label><input class="fi" id="ct-nm" value="" placeholder="אפשר למלא בהמשך"></div>';
  h+='<div class="fg"><label class="flbl">סכום שהתקבל בפועל (₪)</label><input class="fi" id="ct-am" type="number" value="'+(ta.amount||'')+'"></div>';
  h+='<div class="fg"><label class="flbl">תאריך קבלת התשלום</label><input class="fi" id="ct-dp" type="date" value="'+today+'"></div>';
  h+='<div class="fg"><label class="flbl">ישות</label><select class="fs" id="ct-en"><option value="עוסק"'+(ta.entity!=='חברה'?' selected':'')+'>עוסק מורשה</option><option value="חברה"'+(ta.entity==='חברה'?' selected':'')+'>חברה בע"מ</option></select></div>';
  h+='</div>';
  h+='<div class="mftr"><button class="btn" onclick="closeM()">ביטול</button><button class="btn btn-blue" onclick="doConvertToTax(\''+taId+'\')">✅ צור חשבונית מס (שולם)</button></div>';
  showM(h);
}
function cancelInv(iid,refreshPid){
  var inv=null;for(var i=0;i<D.invoices.length;i++)if(D.invoices[i].id===iid){inv=D.invoices[i];break;}
  if(!inv)return;
  var isC=inv.status==='cancelled';
  if(!confirm(isC?'לשחזר את החשבונית (להסיר "מבוטל")?':'לסמן את "'+(inv.invoice_number||inv.invoice_type||'')+'" כמבוטל? היא תישאר בתיק אך תרד מהתזרים ומהחישובים.'))return;
  inv.status=isC?'sent':'cancelled';inv.updated_at=new Date().toISOString();
  svI();cloudSave('invoices',inv);
  if(refreshPid)openPI(refreshPid);else go(D.view);
}
function doConvertToTax(taId){
  var ta=null;for(var i=0;i<D.invoices.length;i++)if(D.invoices[i].id===taId){ta=D.invoices[i];break;}
  if(!ta)return;
  var dp=document.getElementById('ct-dp').value||new Date().toISOString().slice(0,10);
  var tax={id:uid(),project_id:ta.project_id,invoice_number:document.getElementById('ct-nm').value.trim(),invoice_type:'חשבונית מס',amount:parseFloat(document.getElementById('ct-am').value)||null,entity:document.getElementById('ct-en').value,date_sent:dp,date_paid:dp,status:'paid',closes_id:ta.id,created_at:new Date().toISOString(),updated_at:new Date().toISOString()};
  D.invoices.push(tax);
  ta.status='paid';ta.updated_at=new Date().toISOString();
  svI();cloudSave('invoices',tax);cloudSave('invoices',ta);
  closeM();if(ta.project_id)openPI(ta.project_id);else go(D.view);
}
/* ── PROJECT INVOICES POPUP ── */

  h+='</div>';
  if(fin.pfOpenSent||fin.pfPaidNeedsTax){h+='<div style="display:flex;gap:14px;flex-wrap:wrap;font-size:12px;margin:-6px 0 12px;color:#666">';if(fin.pfOpenSent)h+='<span>📄 חשבונות עסקה פתוחים: <strong style="color:'+(fin.wo?'#1860a8':'#999')+'">'+fc(fin.pfOpenSent)+'</strong> '+(fin.wo?'(צפוי בתזרים)':'(ללא הזמנה — לא בתזרים)')+'</span>';if(fin.pfPaidNeedsTax)h+='<span style="color:#b02">🧾 עסקה ששולמה וממתינה לחשבונית מס: <strong>'+fc(fin.pfPaidNeedsTax)+'</strong></span>';h+='</div>';}
  // Contract monthly calendar
  if(isCont&&p.contract_start&&p.contract_end){var months=contractMonths(p);h+='<div style="margin-bottom:14px"><div style="font-size:12px;font-weight:700;color:#3a6b10;margin-bottom:7px">📅 לוח חודשי</div><div class="months-grid">';for(var mi=0;mi<months.length;mi++){var mo=months[mi];if(mo.future){h+='<div class="month-cell month-future"><div class="month-name">'+MONTHS[mo.m].slice(0,3)+'</div><div class="month-inv">'+mo.y+'</div></div>';}else if(mo.invs.length){var paid=mo.invs.filter(function(i){return i.status==='paid';}).length>0;h+='<div class="month-cell month-ok"><div class="month-name">'+MONTHS[mo.m].slice(0,3)+'</div><div class="month-inv">'+mo.y+'<br>'+fc(asum(mo.invs,'amount'))+(paid?' ✓':'')+'</div></div>';}else{h+='<div class="month-cell month-miss" onclick="closeM();openI(null,\''+pid+'\')"><div class="month-name">'+MONTHS[mo.m].slice(0,3)+'</div><div class="month-inv">'+mo.y+'<br>⚠️ חסר</div></div>';}}h+='</div></div>';}
  // Invoice chain view
  if(!invs.length){h+='<div style="padding:16px 0;color:#bbb;text-align:center">אין חשבוניות לפרויקט זה</div>';}
  else{
    // Group: חשבונות עסקה with their linked tax invoices
    var closedIds={};var taxInvs={};
    invs.filter(function(i){return i.closes_id;}).forEach(function(i){closedIds[i.closes_id]=1;taxInvs[i.closes_id]=i;});
    var transactionInvs=invs.filter(function(i){return i.invoice_type==='חשבון עסקה';});
    var otherInvs=invs.filter(function(i){return i.invoice_type!=='חשבון עסקה'&&!i.closes_id;});
    var linkedTaxIds={};transactionInvs.forEach(function(ta){if(taxInvs[ta.id])linkedTaxIds[taxInvs[ta.id].id]=1;});
    if(transactionInvs.length){h+='<div style="font-size:11px;font-weight:700;color:#888;margin-bottom:6px">חשבונות עסקה ושרשרת</div>';
      transactionInvs.forEach(function(ta){
        var s=gi(ta.status);var taxInv=taxInvs[ta.id];
        h+='<div class="inv-chain">';

        h+='<div class="inv-chain-main">'+(ta.file_url?'<a href="#" onclick="openPDF(\''+ta.file_url+'\');return false" title="פתח PDF">📄</a>':'')+'<span style="font-weight:700;min-width:70px">'+ex(ta.invoice_number||'—')+'</span><span class="badge b-osek" style="font-size:10px">ח. עסקה</span><span style="color:#888;font-size:12px">'+fd(ta.date_sent)+'</span>'+muniTag+'<span style="font-weight:700;color:#555">'+fc(ta.amount)+'</span><span class="pill" style="color:'+s.c+';background:'+s.bg+';font-size:11px;cursor:default">'+s.l+'</span><span style="margin-right:auto;display:flex;gap:2px">'+packBtn('i',ta.id)+(ta.status==='cancelled'?'<button class="btn btn-sm btn-ghost" onclick="cancelInv(\''+ta.id+'\',\''+pid+'\')" title="שחזר">↩️</button>':((!taxInv?'<button class="btn btn-sm" style="color:#0e6d54;border-color:#9fe0cb" onclick="convertToTax(\''+ta.id+'\')" title="התקבל תשלום → צור חשבונית מס">💰 התקבל</button>':'')+'<button class="btn btn-sm btn-ghost" onclick="cancelInv(\''+ta.id+'\',\''+pid+'\')" title="בטל חשבון עסקה">🚫</button>'))+'<button class="btn btn-sm btn-ghost" onclick="closeM();openI(\''+ta.id+'\',null)">✏️</button><button class="btn btn-sm btn-ghost btn-red" onclick="delIFromPI(\''+ta.id+'\',\''+pid+'\')">🗑</button></span></div>';
        if(taxInv){var ts=gi(taxInv.status);h+='<div class="inv-chain-sub has-tax"><span class="chain-arrow">└──</span><span style="font-weight:700;min-width:70px">'+ex(taxInv.invoice_number||'—')+'</span><span class="badge b-chev" style="font-size:10px">חשב\' מס</span><span style="color:#3a6b10;font-size:12px">'+fd(taxInv.date_sent)+'</span><span style="font-weight:700">'+fc(taxInv.amount)+'</span><span class="pill" style="color:'+ts.c+';background:'+ts.bg+';font-size:11px;cursor:default">'+ts.l+'</span><span style="margin-right:auto;display:flex;gap:2px"><button class="btn btn-sm btn-ghost" onclick="closeM();openI(\''+taxInv.id+'\',null)">✏️</button><button class="btn btn-sm btn-ghost btn-red" onclick="delIFromPI(\''+taxInv.id+'\',\''+pid+'\')">🗑</button></span></div>';}
        else if(ta.status==='paid'||ta.status==='accounting'){h+='<div class="inv-chain-sub need-tax" onclick="convertToTax(\''+ta.id+'\')"><span class="chain-arrow">└──</span><span>⚠️ שולם — צור חשבונית מס</span><span style="margin-right:auto;font-size:11px;font-weight:700">💰 המר ▸</span></div>';}
        h+='</div>';
      });
    }
    if(otherInvs.length){if(transactionInvs.length)h+='<div style="font-size:11px;font-weight:700;color:#888;margin:10px 0 6px">חשבוניות אחרות</div>';
      otherInvs.forEach(function(inv){if(linkedTaxIds[inv.id])return;var s=gi(inv.status);var isTax=inv.invoice_type==='חשבונית מס';h+='<div class="inv-chain-solo">'+(inv.file_url?'<a href="#" onclick="openPDF(\''+inv.file_url+'\');return false" title="פתח PDF">📄</a>':'')+'<span style="font-weight:700;min-width:70px">'+ex(inv.invoice_number||'—')+'</span><span class="badge '+(isTax?'b-chev':'b-osek')+'" style="font-size:10px">'+ex(inv.invoice_type||'')+'</span><span style="color:#888;font-size:12px">'+fd(inv.date_sent)+'</span><span style="font-weight:700;color:'+(isTax?'#3a6b10':'#555')+'">'+fc(inv.amount)+'</span><span class="pill" style="color:'+s.c+';background:'+s.bg+';font-size:11px;cursor:default">'+s.l+'</span><span style="margin-right:auto;display:flex;gap:2px"><button class="btn btn-sm btn-ghost" onclick="closeM();openI(\''+inv.id+'\',null)">✏️</button><button class="btn btn-sm btn-ghost btn-red" onclick="delIFromPI(\''+inv.id+'\',\''+pid+'\')">🗑</button></span></div>';});

  var catSel='<select class="fs" id="pf-cat" style="padding:5px 8px;font-size:12px">';PFCAT.forEach(function(cx){catSel+='<option value="'+ex(cx)+'">'+ex(cx)+'</option>';});catSel+='</select>';
  h+='<div style="display:flex;align-items:center;gap:7px;margin-bottom:10px">'+catSel+'<label class="btn btn-sm btn-blue" style="cursor:pointer">📤 העלה קובץ<input type="file" style="display:none" onchange="handleProjFileUpload(\''+pid+'\',this)"></label><span style="font-size:11px;color:#aaa">PDF / תמונה / כל קובץ</span></div>';
  if(!files.length){h+='<div style="font-size:12px;color:#bbb;padding:4px 0">אין מסמכים עדיין — העלה הזמנת עבודה, חשבון מאושר, הצעת מחיר וכו\'.</div>';}
  else{

    });
  }
  h+='</div>';
  h+='<div class="mftr"><button class="btn" onclick="openP(\''+pid+'\')">✏️ ערוך פרויקט</button><button class="btn btn-blue" onclick="closeM();openI(null,\''+pid+'\')">+ חשבונית חדשה</button></div>';
  showM(h);
}
/* ── EMPLOYEE MODAL ── */
function eDOpts(cid,selId){var a=DP[cid]||[],r='';for(var i=0;i<a.length;i++)if(a[i].emp)r+='<option value="'+a[i].id+'"'+(a[i].id===selId?' selected':'')+'>'+ex(a[i].name)+'</option>';return r;}
function onEC(cid){document.getElementById('e-d').innerHTML=eDOpts(cid,'');}
function openE(eid){var em=null;if(eid)for(var i=0;i<D.employees.length;i++)if(D.employees[i].id===eid){em=D.employees[i];break;}var empCL=[];for(var i=0;i<CL.length;i++){var a=DP[CL[i].id]||[];for(var j=0;j<a.length;j++)if(a[j].emp){empCL.push(CL[i]);break;}}var clO='';for(var i=0;i<empCL.length;i++)clO+='<option value="'+empCL[i].id+'"'+(em&&em.client_id===empCL[i].id?' selected':'')+'>'+ex(empCL[i].name)+'</option>';var iCl=em?em.client_id:'jlm';var h='<div class="mhdr"><span class="mtitle">'+(em?'עריכת עובד':'עובד חדש')+'</span><button class="mx" onclick="closeM()">✕</button></div><div class="fg2"><div class="fg w2"><label class="flbl">שם העובד *</label><input class="fi" id="e-nm" value="'+ex(em?em.name||'':'')+'"></div><div class="fg"><label class="flbl">לקוח (מקום עבודה)</label><select class="fs" id="e-cl" onchange="onEC(this.value)">'+clO+'</select></div><div class="fg"><label class="flbl">מחלקה</label><select class="fs" id="e-d">'+eDOpts(iCl,em?em.department_id:'')+'</select></div><div class="fg"><label class="flbl">תעריף לשעה (₪)</label><input class="fi" id="e-rt" type="number" value="'+(em?em.hourly_rate||'':'')+'"></div><div class="fg"><label class="flbl">שעות ממוצע / חודש</label><input class="fi" id="e-hr" type="number" value="'+(em?em.monthly_hours||'':'')+'"></div><div class="fg"><label class="flbl">עלות מעסיק / חודש (₪)</label><input class="fi" id="e-ec" type="number" value="'+(em?em.employer_cost||'':'')+'"></div><div class="fg"><label class="flbl">עלות רכב / חודש (₪)</label><input class="fi" id="e-cr" type="number" value="'+(em?em.car_cost_monthly||'':'')+'"></div><div class="fg"><label class="flbl">יש רכב?</label><select class="fs" id="e-hc"><option value="0"'+(!em||!em.has_car?' selected':'')+'>לא</option><option value="1"'+(em&&em.has_car?' selected':'')+'>כן 🚗</option></select></div></div><div class="mftr">'+(em?'<button class="btn btn-red" onclick="delE(\''+eid+'\')">🗑 מחק</button>':'')+'<button class="btn" onclick="closeM()">ביטול</button><button class="btn btn-blue" onclick="svE2(\''+( eid||'')+'\')">💾 שמור</button></div>';showM(h);}
function svE2(eid){var nm=document.getElementById('e-nm').value.trim();if(!nm){alert('נא להזין שם עובד');return;}var data={name:nm,client_id:document.getElementById('e-cl').value,department_id:document.getElementById('e-d').value,hourly_rate:parseFloat(document.getElementById('e-rt').value)||null,monthly_hours:parseFloat(document.getElementById('e-hr').value)||null,employer_cost:parseFloat(document.getElementById('e-ec').value)||null,car_cost_monthly:parseFloat(document.getElementById('e-cr').value)||null,has_car:document.getElementById('e-hc').value==='1'};if(eid){for(var i=0;i<D.employees.length;i++)if(D.employees[i].id===eid){D.employees[i]=Object.assign({},D.employees[i],data);break;}}else{data.id=uid();data.created_at=new Date().toISOString();D.employees.push(data);}svE();var _eid2=eid?D.employees.filter(function(x){return x.id===eid;})[0]:D.employees[D.employees.length-1];if(_eid2)cloudSave('employees',_eid2);closeM();go(D.view);}
function delE(eid){if(!confirm('למחוק עובד זה?'))return;D.employees=D.employees.filter(function(e){return e.id!==eid;});svE();cloudDel('employees',eid);closeM();go('employees');}
load();go('dashboard');
