<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ניהול פיקוח — ארזים הנדסה</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700&display=swap');

*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --sb:220px;
  --tb:56px;
  --bg:#f0eeea;
  --surf:#ffffff;
  --border:rgba(0,0,0,0.09);
  --border2:rgba(0,0,0,0.16);
  --text:#1e1e1c;
  --muted:#6b6a66;
  --hint:#a09f9b;
  --r:8px;
  --rl:12px;
  --blue:#185FA5;
  --blue-bg:#E6F1FB;
  --green:#3B6D11;
  --green-bg:#EAF3DE;
  --amber:#854F0B;
  --amber-bg:#FAEEDA;
  --red:#A32D2D;
  --red-bg:#FCEBEB;
  --purple:#3C3489;
  --purple-bg:#EEEDFE;
  --teal:#0F6E56;
  --teal-bg:#E1F5EE;
  --gray:#5F5E5A;
  --gray-bg:#F1EFE8;
}
html{font-family:'Heebo',sans-serif;font-size:14px;line-height:1.5;}
body{background:var(--bg);color:var(--text);min-height:100vh;display:flex;overflow-x:hidden;}

/* ── SIDEBAR ── */
#sidebar{
  width:var(--sb);background:var(--surf);
  border-left:1px solid var(--border);
  display:flex;flex-direction:column;
  position:fixed;right:0;top:0;bottom:0;z-index:100;
}
.sb-logo{padding:18px 20px 14px;border-bottom:1px solid var(--border);}
.sb-logo-mark{font-size:20px;font-weight:700;color:var(--blue);letter-spacing:-0.5px;}
.sb-logo-sub{font-size:11px;color:var(--muted);margin-top:1px;}
.sb-section{font-size:10px;font-weight:600;color:var(--hint);text-transform:uppercase;letter-spacing:0.08em;padding:14px 20px 4px;}
.nav-item{
  display:flex;align-items:center;gap:9px;
  padding:9px 20px;cursor:pointer;
  color:var(--muted);font-size:13px;font-weight:400;
  transition:background 0.12s,color 0.12s;
  position:relative;
}
.nav-item:hover{background:#f5f4f0;color:var(--text);}
.nav-item.active{color:var(--blue);font-weight:500;background:var(--blue-bg);}
.nav-item.active::after{content:'';position:absolute;right:0;top:4px;bottom:4px;width:3px;background:var(--blue);border-radius:2px 0 0 2px;}
.nav-ic{font-size:15px;width:18px;text-align:center;}
.nav-badge{
  margin-right:auto;
  background:var(--red);color:#fff;
  font-size:10px;font-weight:600;
  padding:1px 6px;border-radius:10px;min-width:18px;text-align:center;
}
.sb-bottom{margin-top:auto;padding:16px 20px;border-top:1px solid var(--border);font-size:11px;color:var(--hint);}

/* ── MAIN ── */
#content{margin-right:var(--sb);flex:1;display:flex;flex-direction:column;min-height:100vh;}

/* ── TOPBAR ── */
#topbar{
  background:var(--surf);border-bottom:1px solid var(--border);
  height:var(--tb);display:flex;align-items:center;
  padding:0 24px;gap:10px;position:sticky;top:0;z-index:50;
}
#topbar h2{font-size:15px;font-weight:600;flex:1;}
.topbar-meta{font-size:12px;color:var(--muted);}

/* ── VIEW ── */
#view{padding:22px 24px;flex:1;}

/* ── BUTTONS ── */
.btn{
  display:inline-flex;align-items:center;gap:6px;
  padding:7px 14px;border-radius:var(--r);
  border:1px solid var(--border2);background:var(--surf);
  color:var(--text);cursor:pointer;font-size:13px;font-weight:500;
  font-family:'Heebo',sans-serif;transition:background 0.12s;white-space:nowrap;
}
.btn:hover{background:#f5f4f0;}
.btn-primary{background:var(--blue);color:#fff;border-color:var(--blue);}
.btn-primary:hover{background:#0C447C;}
.btn-sm{padding:4px 10px;font-size:12px;}
.btn-ghost{border-color:transparent;background:transparent;}
.btn-ghost:hover{background:#f5f4f0;}
.btn-red{color:var(--red);border-color:#F09595;}
.btn-red:hover{background:var(--red-bg);}
.btn-green{background:var(--teal-bg);color:var(--teal);border-color:#9FE1CB;}
.btn-green:hover{background:#c2edd9;}

/* ── CARDS / STATS ── */
.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:20px;}
.stat-card{background:var(--surf);border:1px solid var(--border);border-radius:var(--rl);padding:14px 16px;}
.stat-label{font-size:11px;color:var(--muted);margin-bottom:5px;font-weight:500;}
.stat-value{font-size:21px;font-weight:700;letter-spacing:-0.5px;}
.stat-sub{font-size:11px;color:var(--hint);margin-top:3px;}

/* ── FILTER BAR ── */
.filter-bar{display:flex;gap:8px;align-items:center;margin-bottom:14px;flex-wrap:wrap;}
.filter-bar select,.filter-bar input[type=text]{
  padding:6px 10px;border:1px solid var(--border2);border-radius:var(--r);
  background:var(--surf);color:var(--text);font-size:13px;font-family:'Heebo',sans-serif;
}
.filter-bar select:focus,.filter-bar input:focus{outline:none;border-color:var(--blue);}
.filter-bar input{width:180px;}
.filter-count{font-size:12px;color:var(--muted);margin-right:auto;}

/* ── TABLE ── */
.tbl-wrap{background:var(--surf);border:1px solid var(--border);border-radius:var(--rl);overflow:hidden;}
table{width:100%;border-collapse:collapse;}
th{
  padding:9px 13px;font-size:11px;font-weight:600;color:var(--muted);
  text-transform:uppercase;letter-spacing:0.05em;
  border-bottom:1px solid var(--border);text-align:right;
  background:#faf9f7;white-space:nowrap;
}
td{padding:10px 13px;font-size:13px;border-bottom:1px solid var(--border);vertical-align:middle;}
tr:last-child td{border-bottom:none;}
tr:hover td{background:#faf9f8;}
.tbl-empty{padding:40px;text-align:center;color:var(--hint);font-size:13px;}

/* ── PILLS / BADGES ── */
.pill{
  display:inline-flex;align-items:center;padding:3px 9px;
  border-radius:20px;font-size:11px;font-weight:500;white-space:nowrap;
  cursor:pointer;transition:opacity 0.12s;
}
.pill:hover{opacity:0.8;}
.badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:500;}
.badge-osek{background:var(--blue-bg);color:var(--blue);}
.badge-chevra{background:var(--purple-bg);color:var(--purple);}
.dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;display:inline-block;}
.client-chip{display:flex;align-items:center;gap:5px;font-size:12px;font-weight:500;}

/* ── WORK ORDER ── */
.wo-ok{display:inline-flex;align-items:center;gap:3px;background:var(--green-bg);color:var(--green);border:1px solid #C0DD97;border-radius:4px;font-size:11px;padding:2px 7px;}
.wo-miss{color:var(--amber);font-size:11px;display:flex;align-items:center;gap:3px;}

/* ── ALERTS ── */
.alert-item{
  display:flex;align-items:center;gap:10px;
  padding:9px 14px;background:var(--amber-bg);
  border:1px solid #FAC775;border-radius:var(--r);
  margin-bottom:6px;font-size:13px;color:#633806;
}
.alert-act{margin-right:auto;font-size:12px;color:var(--amber);cursor:pointer;font-weight:500;}
.alert-act:hover{text-decoration:underline;}

/* ── MODAL ── */
#modal-bg{
  display:none;position:fixed;inset:0;
  background:rgba(0,0,0,0.3);z-index:200;
  align-items:center;justify-content:center;
}
#modal-bg.open{display:flex;}
.modal{
  background:var(--surf);border-radius:var(--rl);padding:24px;
  width:640px;max-width:calc(100vw - 32px);
  max-height:calc(100vh - 60px);overflow-y:auto;
}
.modal-hdr{display:flex;align-items:center;margin-bottom:20px;}
.modal-title{font-size:15px;font-weight:600;flex:1;}
.modal-x{background:none;border:none;font-size:20px;cursor:pointer;color:var(--muted);padding:4px;font-family:'Heebo',sans-serif;}
.modal-x:hover{color:var(--text);}

/* ── FORM ── */
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.fg{display:flex;flex-direction:column;gap:4px;}
.fg.full{grid-column:1/-1;}
.flabel{font-size:11px;font-weight:600;color:var(--muted);}
.fi,.fs,.fta{
  padding:8px 10px;border:1px solid var(--border2);border-radius:var(--r);
  font-size:13px;font-family:'Heebo',sans-serif;color:var(--text);background:var(--surf);
}
.fi:focus,.fs:focus,.fta:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 2px rgba(24,95,165,0.12);}
.fta{resize:vertical;min-height:66px;}
.modal-footer{display:flex;justify-content:flex-end;gap:8px;margin-top:18px;padding-top:16px;border-top:1px solid var(--border);}

/* ── STATUS OPTIONS ── */
.status-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.status-opt{
  padding:10px 13px;border-radius:var(--r);border:1.5px solid transparent;
  cursor:pointer;font-size:13px;font-weight:500;transition:opacity 0.12s;
}
.status-opt:hover{opacity:0.82;}
.status-opt.sel{border-color:currentColor!important;}

/* ── EMPLOYEE CARDS ── */
.emp-card{background:var(--surf);border:1px solid var(--border);border-radius:var(--rl);padding:16px 18px;margin-bottom:10px;}
.emp-avatar{width:38px;height:38px;border-radius:50%;background:var(--blue-bg);display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;color:var(--blue);flex-shrink:0;}
.profit-num{font-size:19px;font-weight:700;letter-spacing:-0.5px;}
.emp-metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px;padding-top:12px;border-top:1px solid var(--border);}
.emp-metric{text-align:center;}
.emp-metric-label{font-size:10px;color:var(--muted);margin-bottom:3px;}
.emp-metric-val{font-size:14px;font-weight:600;}

/* ── INFO BAR ── */
.info-bar{background:var(--teal-bg);border:1px solid #9FE1CB;border-radius:var(--r);padding:10px 14px;font-size:13px;color:#085041;margin-bottom:18px;}

/* ── CLIENT SUMMARY ── */
.client-sum-row{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid #f0eeea;font-size:13px;}
.client-sum-row:last-child{border-bottom:none;}

/* ── SECTION HEADER ── */
.sec-hdr{display:flex;align-items:center;gap:10px;margin-bottom:14px;}
.sec-hdr h3{font-size:14px;font-weight:600;}

/* ── TOTAL ROW ── */
tfoot td{padding:9px 13px;font-size:13px;font-weight:600;background:#faf9f7;border-top:1px solid var(--border);}

/* ── RESPONSIVE ── */
@media(max-width:880px){
  :root{--sb:0px;}
  #sidebar{display:none;}
  .stats-grid{grid-template-columns:1fr 1fr;}
}
</style>
</head>
<body>

<!-- ══════════ SIDEBAR ══════════ -->
<aside id="sidebar">
  <div class="sb-logo">
    <div class="sb-logo-mark">ארזים</div>
    <div class="sb-logo-sub">ניהול פיקוח בנייה</div>
  </div>
  <nav>
    <div class="sb-section">ראשי</div>
    <div class="nav-item active" onclick="nav('dashboard')" id="nav-dashboard">
      <span class="nav-ic">📊</span>לוח בקרה
    </div>
    <div class="nav-item" onclick="nav('projects')" id="nav-projects">
      <span class="nav-ic">📋</span>כל הפרויקטים
      <span class="nav-badge" id="open-badge" style="display:none">0</span>
    </div>
    <div class="nav-item" onclick="nav('invoices')" id="nav-invoices">
      <span class="nav-ic">🧾</span>חשבוניות
      <span class="nav-badge" id="inv-badge" style="display:none">0</span>
    </div>
    <div class="sb-section">עובדים</div>
    <div class="nav-item" onclick="nav('employees')" id="nav-employees">
      <span class="nav-ic">👥</span>עובדים ורווח
    </div>
    <div class="sb-section">התראות</div>
    <div class="nav-item" onclick="nav('alerts')" id="nav-alerts">
      <span class="nav-ic">⚠️</span>דברים פתוחים
      <span class="nav-badge" id="alerts-badge">0</span>
    </div>
  </nav>
  <div class="sb-bottom">מ.ס ארזים הנדסה בע"מ</div>
</aside>

<!-- ══════════ MAIN ══════════ -->
<main id="content">
  <header id="topbar">
    <h2 id="view-title">לוח בקרה</h2>
    <div id="topbar-actions"></div>
  </header>
  <div id="view"></div>
</main>

<!-- ══════════ MODAL ══════════ -->
<div id="modal-bg" onclick="bgClose(event)">
  <div class="modal" id="modal" onclick="event.stopPropagation()"></div>
</div>

<script>
/* ═══════════════════════════════════════
   DATA CONSTANTS
═══════════════════════════════════════ */
const CLIENTS=[
  {id:'jlm', name:'עיריית ירושלים',      entity:'עוסק',  color:'#185FA5'},
  {id:'rl',  name:'עיריית ראשון לציון',   entity:'עוסק',  color:'#3C3489'},
  {id:'bs',  name:'עיריית בית שמש',       entity:'חברה',  color:'#0F6E56'},
  {id:'ge',  name:'גוש עציון',            entity:'עוסק',  color:'#854F0B'},
  {id:'ef',  name:'אפרת',                 entity:'חברה',  color:'#993556'},
  {id:'nc',  name:'נס ציונה',             entity:'עוסק',  color:'#5F5E5A'},
  {id:'kg',  name:'קרית גת',              entity:'עוסק',  color:'#5F5E5A'},
];

const DEPTS={
  jlm:[
    {id:'jlm_admin',  name:'מינהלת העירייה',           has_emp:true},
    {id:'jlm_plan',   name:'מנהל חינוך — תכנון',       has_emp:false},
    {id:'jlm_exec',   name:'מנהל חינוך — ביצוע/אחר',  has_emp:false},
    {id:'jlm_nagish', name:'נגישות ואקוסטיקה',          has_emp:false},
    {id:'jlm_safety', name:'בטיחות חינוך חרדי',         has_emp:false},
  ],
  rl:[
    {id:'rl_elect', name:'מחלקת חשמל', has_emp:true},
    {id:'rl_binuy', name:'מחלקת בינוי', has_emp:true},
    {id:'rl_shpua', name:'מחלקת שפ"ע', has_emp:true},
  ],
  bs:[{id:'bs_gen',name:'כללי',has_emp:false}],
  ge:[{id:'ge_gen',name:'כללי',has_emp:false}],
  ef:[{id:'ef_gen',name:'כללי',has_emp:false}],
  nc:[{id:'nc_gen',name:'כללי',has_emp:false}],
  kg:[{id:'kg_gen',name:'כללי',has_emp:false}],
};

const STATUSES={
  no_order:     {label:'ללא הזמנה',         color:'#888780', bg:'#F1EFE8'},
  pending_order:{label:'ממתין להזמנה',       color:'#854F0B', bg:'#FAEEDA'},
  offer_sent:   {label:'נשלח חשבון עסקה',   color:'#185FA5', bg:'#E6F1FB'},
  accounting:   {label:'בהנה"ח עירייה',      color:'#0F6E56', bg:'#E1F5EE'},
  paid:         {label:'שולם',               color:'#3B6D11', bg:'#EAF3DE'},
  invoice_sent: {label:'נשלחה חשבונית מס',  color:'#3C3489', bg:'#EEEDFE'},
  closed:       {label:'סגור',               color:'#5F5E5A', bg:'#F1EFE8'},
};

const INV_TYPES=['הצעת מחיר','חשבון עסקה','חשבונית מס','קבלה'];

const INV_ST={
  draft:     {label:'טיוטה',   color:'#888780', bg:'#F1EFE8'},
  sent:      {label:'נשלח',    color:'#185FA5', bg:'#E6F1FB'},
  accounting:{label:'בהנה"ח', color:'#854F0B', bg:'#FAEEDA'},
  paid:      {label:'שולם',    color:'#3B6D11', bg:'#EAF3DE'},
};

/* ═══════════════════════════════════════
   STATE
═══════════════════════════════════════ */
let S={view:'dashboard',projects:[],invoices:[],employees:[],
  filters:{client:'',status:'',entity:'',q:''}};

/* ═══════════════════════════════════════
   PERSISTENCE
═══════════════════════════════════════ */
const LS={
  load(){
    S.projects =JSON.parse(localStorage.getItem('az_p')||'[]');
    S.invoices =JSON.parse(localStorage.getItem('az_i')||'[]');
    S.employees=JSON.parse(localStorage.getItem('az_e')||'[]');
  },
  saveP(){localStorage.setItem('az_p',JSON.stringify(S.projects));},
  saveI(){localStorage.setItem('az_i',JSON.stringify(S.invoices));},
  saveE(){localStorage.setItem('az_e',JSON.stringify(S.employees));},
};

/* ═══════════════════════════════════════
   HELPERS
═══════════════════════════════════════ */
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const fc=n=>(!n&&n!==0)?'—':'₪'+Math.round(n).toLocaleString('he-IL');
const fd=d=>d?new Date(d).toLocaleDateString('he-IL'):'—';
const cl=id=>CLIENTS.find(c=>c.id===id)||{};
const dep=( cid,did)=>(DEPTS[cid]||[]).find(d=>d.id===did)||{};
const st=s=>STATUSES[s]||STATUSES.no_order;
const ist=s=>INV_ST[s]||INV_ST.draft;
const projInvs=pid=>S.invoices.filter(i=>i.project_id===pid);
const alerts=()=>S.projects.filter(p=>p.status!=='closed'&&
  (p.status==='no_order'||p.status==='pending_order'||
  (p.status==='paid'&&!p.invoice_sent_date)));
const pendingInvs=()=>S.invoices.filter(i=>i.status==='sent'||i.status==='accounting');
const totalAmt=(arr,field)=>arr.reduce((s,x)=>s+(x[field]||0),0);

/* ═══════════════════════════════════════
   NAVIGATION
═══════════════════════════════════════ */
function nav(view){
  S.view=view;
  document.querySelectorAll('.nav-item').forEach(e=>e.classList.remove('active'));
  const el=document.getElementById('nav-'+view);
  if(el)el.classList.add('active');
  const titles={dashboard:'לוח בקרה',projects:'כל הפרויקטים',invoices:'חשבוניות',employees:'עובדים ורווח',alerts:'דברים פתוחים'};
  document.getElementById('view-title').textContent=titles[view]||view;
  const acts={
    projects:`<button class="btn btn-primary" onclick="openProjModal()">+ פרויקט חדש</button>`,
    invoices:`<button class="btn btn-primary" onclick="openInvModal()">+ חשבונית חדשה</button>`,
    employees:`<button class="btn btn-primary" onclick="openEmpModal()">+ עובד חדש</button>`,
  };
  document.getElementById('topbar-actions').innerHTML=acts[view]||'';
  const renders={dashboard:renderDash,projects:renderProjects,invoices:renderInvoices,employees:renderEmployees,alerts:renderAlerts};
  document.getElementById('view').innerHTML=(renders[view]||renderDash)();
  updateBadges();
}

function updateBadges(){
  const al=alerts().length;
  const ob=document.getElementById('alerts-badge');
  if(ob)ob.textContent=al;
  const pb=document.getElementById('open-badge');
  const op=S.projects.filter(p=>p.status!=='closed').length;
  if(pb){pb.textContent=op;pb.style.display=op?'':'none';}
  const ib=document.getElementById('inv-badge');
  const ip=pendingInvs().length;
  if(ib){ib.textContent=ip;ib.style.display=ip?'':'none';}
}

/* ═══════════════════════════════════════
   DASHBOARD
═══════════════════════════════════════ */
function renderDash(){
  const active=S.projects.filter(p=>p.status!=='closed').length;
  const noOrd=S.projects.filter(p=>p.status==='no_order').length;
  const pendAmt=totalAmt(pendingInvs(),'amount');
  const paidAmt=totalAmt(S.invoices.filter(i=>i.status==='paid'),'amount');
  const al=alerts();

  const clientRows=CLIENTS.map(c=>{
    const ps=S.projects.filter(p=>p.client_id===c.id&&p.status!=='closed');
    if(!ps.length)return'';
    const tot=totalAmt(ps,'supervision_amount');
    return`<div class="client-sum-row">
      <span class="dot" style="background:${c.color}"></span>
      <span style="flex:1;font-weight:500;">${c.name}</span>
      <span style="color:var(--muted);font-size:12px;">${ps.length} פרויקטים</span>
      <span style="font-weight:600;min-width:90px;text-align:left;">${fc(tot)}</span>
    </div>`;
  }).join('');

  const alHtml=al.slice(0,6).map(p=>{
    const c=cl(p.client_id);const s=st(p.status);
    return`<div class="alert-item">
      <span>⚠️</span>
      <span><strong>${p.name}</strong> — ${c.name||''}</span>
      <span class="pill" style="color:${s.color};background:${s.bg};font-size:11px;">${s.label}</span>
      <span class="alert-act" onclick="nav('projects')">→ פתח</span>
    </div>`;
  }).join('');

  return`
  <div class="stats-grid">
    <div class="stat-card">
      <div class="stat-label">פרויקטים פעילים</div>
      <div class="stat-value">${active}</div>

/* ═══════════════════════════════════════
   PROJECTS
═══════════════════════════════════════ */
function filteredProjects(){
  return S.projects.filter(p=>{
    if(S.filters.client&&p.client_id!==S.filters.client)return false;
    if(S.filters.status&&p.status!==S.filters.status)return false;
    if(S.filters.entity&&p.entity!==S.filters.entity)return false;
    if(S.filters.q){
      const q=S.filters.q.toLowerCase();
      if(!(p.name||'').toLowerCase().includes(q)&&
         !(p.contact_name||'').toLowerCase().includes(q)&&
         !(p.work_order_number||'').toLowerCase().includes(q))return false;
    }
    return true;
  });
}

      <span><strong>${p.name}</strong> — ${c.name||''}</span>
      <span style="color:var(--muted);font-size:12px;margin-right:auto;">${fc(p.supervision_amount)}</span>

    </div>`;
  },'אין ממתינים להזמנה')
  +sec(`💰 ממתין לתשלום (${pendPay.length})`,pendPay,inv=>{
    const p=S.projects.find(x=>x.id===inv.project_id)||{};const c=cl(p.client_id);

}

function buildDeptOpts(cid,selDid){
  return (DEPTS[cid]||[]).map(d=>
    `<option value="${d.id}" ${d.id===selDid?'selected':''}>${d.name}</option>`
  ).join('');
}
function onClChange(cid){
  document.getElementById('fc-dept').innerHTML=buildDeptOpts(cid);
  const c=CLIENTS.find(x=>x.id===cid);
  if(c?.entity)document.getElementById('fc-ent').value=c.entity;
}
function calcAmt(){
  const s=parseFloat(document.getElementById('fc-scope').value)||0;
  const p=parseFloat(document.getElementById('fc-pct').value)||0;
  if(s&&p)document.getElementById('fc-amt').value=Math.round(s*p/100);
}
function saveProj(pid){
  const name=document.getElementById('fc-name').value.trim();
  if(!name){alert('נא להזין שם פרויקט');return;}
  const d={
    client_id:document.getElementById('fc-cl').value,
    department_id:document.getElementById('fc-dept').value,
    name,contact_name:document.getElementById('fc-cont').value.trim(),
    entity:document.getElementById('fc-ent').value,
    scope_amount:parseFloat(document.getElementById('fc-scope').value)||null,
    supervision_pct:parseFloat(document.getElementById('fc-pct').value)||null,
    supervision_amount:parseFloat(document.getElementById('fc-amt').value)||null,
    status:document.getElementById('fc-st').value,
    work_order_number:document.getElementById('fc-wo').value.trim(),
    notes:document.getElementById('fc-notes').value.trim(),
    updated_at:new Date().toISOString(),
  };
  if(pid){const i=S.projects.findIndex(p=>p.id===pid);if(i>=0)S.projects[i]={...S.projects[i],...d};}
  else S.projects.push({id:uid(),created_at:new Date().toISOString(),...d});
  LS.saveP();closeModal();nav(S.view);
}
function delProj(pid,fromModal){
  const p=S.projects.find(x=>x.id===pid);if(!p)return;
  if(!confirm(`למחוק "${p.name}"?\nהפעולה לא ניתנת לביטול.`))return;
  S.projects=S.projects.filter(x=>x.id!==pid);
  LS.saveP();closeModal();nav('projects');
}

  LS.saveP();closeModal();nav(S.view);
}

/* ═══════════════════════════════════════
   INVOICE MODAL
═══════════════════════════════════════ */
function openInvModal(iid,prefillPid){
  const inv=iid?S.invoices.find(x=>x.id===iid):null;
  const isEdit=!!inv;
  const pOpts=S.projects.map(p=>{
    const c=cl(p.client_id);
    return`<option value="${p.id}" ${(inv?.project_id||prefillPid)===p.id?'selected':''}>${p.name} (${c.name||''})</option>`;
  }).join('');
  const tOpts=INV_TYPES.map(t=>`<option value="${t}" ${inv?.invoice_type===t?'selected':''}>${t}</option>`).join('');
  const stOpts=Object.entries(INV_ST).map(([k,v])=>`<option value="${k}" ${(inv?.status||'draft')===k?'selected':''}>${v.label}</option>`).join('');

  modal(`
    <div class="modal-hdr">
      <span class="modal-title">${isEdit?'עריכת חשבונית':'חשבונית חדשה'}</span>
      <button class="modal-x" onclick="closeModal()">✕</button>
    </div>
    <div class="fgrid">
      <div class="fg full">
        <label class="flabel">פרויקט</label>
        <select class="fs" id="ic-proj">${pOpts||'<option>אין פרויקטים — הוסף קודם</option>'}</select>
      </div>
      <div class="fg">
        <label class="flabel">מספר חשבונית</label>
        <input class="fi" id="ic-num" value="${inv?.invoice_number||''}" placeholder="90750">
      </div>
      <div class="fg">
        <label class="flabel">סוג</label>
        <select class="fs" id="ic-type">${tOpts}</select>
      </div>
      <div class="fg">
        <label class="flabel">סכום (₪)</label>
        <input class="fi" id="ic-amt" type="number" value="${inv?.amount||''}">
      </div>
      <div class="fg">
        <label class="flabel">ישות</label>
        <select class="fs" id="ic-ent">
          <option value="עוסק" ${(inv?.entity||'עוסק')==='עוסק'?'selected':''}>עוסק מורשה</option>
          <option value="חברה" ${inv?.entity==='חברה'?'selected':''}>חברה בע"מ</option>
        </select>
      </div>
      <div class="fg">
        <label class="flabel">תאריך שליחה</label>
        <input class="fi" id="ic-date" type="date" value="${inv?.date_sent||''}">
      </div>
      <div class="fg">
        <label class="flabel">סטטוס תשלום</label>
        <select class="fs" id="ic-st">${stOpts}</select>
      </div>
      <div class="fg">
        <label class="flabel">תאריך תשלום</label>
        <input class="fi" id="ic-paid" type="date" value="${inv?.date_paid||''}">
      </div>
      <div class="fg full">
        <label class="flabel">הערות</label>
        <textarea class="fta" id="ic-notes">${inv?.notes||''}</textarea>
      </div>
    </div>
    <div class="modal-footer">
      ${isEdit?`<button class="btn btn-red" onclick="delInv('${inv.id}',true)">🗑 מחק</button>`:''}
      <button class="btn" onclick="closeModal()">ביטול</button>
      <button class="btn btn-primary" onclick="saveInv('${iid||''}')">💾 שמור</button>
    </div>`);
}

function saveInv(iid){
  const d={
    project_id:document.getElementById('ic-proj').value,
    invoice_number:document.getElementById('ic-num').value.trim(),
    invoice_type:document.getElementById('ic-type').value,
    amount:parseFloat(document.getElementById('ic-amt').value)||null,
    entity:document.getElementById('ic-ent').value,
    date_sent:document.getElementById('ic-date').value||null,
    date_paid:document.getElementById('ic-paid').value||null,
    status:document.getElementById('ic-st').value,
    notes:document.getElementById('ic-notes').value.trim(),
    updated_at:new Date().toISOString(),
  };
  if(iid){const i=S.invoices.findIndex(x=>x.id===iid);if(i>=0)S.invoices[i]={...S.invoices[i],...d};}
  else S.invoices.push({id:uid(),created_at:new Date().toISOString(),...d});
  LS.saveI();closeModal();nav(S.view);
}
function delInv(iid,fromModal){
  if(!confirm('למחוק חשבונית זו?'))return;
  S.invoices=S.invoices.filter(x=>x.id!==iid);
  LS.saveI();closeModal();nav(S.view);
}

/* ═══════════════════════════════════════
   PROJECT INVOICES VIEW
═══════════════════════════════════════ */
function openProjInvs(pid){
  const p=S.projects.find(x=>x.id===pid);if(!p)return;
  const invs=projInvs(pid);
  const rows=invs.map(inv=>{
    const s=ist(inv.status);
    return`<div style="display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--border);font-size:13px;">
      <span style="font-weight:600;min-width:70px;">${inv.invoice_number||'—'}</span>
      <span style="color:var(--muted);font-size:12px;">${inv.invoice_type||'—'}</span>
      <span class="badge ${inv.entity==='חברה'?'badge-chevra':'badge-osek'}">${inv.entity||'עוסק'}</span>
      <span style="font-weight:600;color:var(--green);min-width:80px;">${fc(inv.amount)}</span>
      <span style="color:var(--muted);font-size:12px;">${fd(inv.date_sent)}</span>
      <span class="pill" style="color:${s.color};background:${s.bg};font-size:11px;">${s.label}</span>
      <button class="btn btn-sm btn-ghost" style="margin-right:auto;" onclick="closeModal();openInvModal('${inv.id}')">✏️</button>
    </div>`;
  }).join('');
  modal(`
    <div class="modal-hdr">
      <span class="modal-title">חשבוניות — ${p.name}</span>
      <button class="modal-x" onclick="closeModal()">✕</button>
    </div>
    <div>${rows||'<div style="padding:20px 0;color:var(--hint);text-align:center;">אין חשבוניות לפרויקט זה</div>'}</div>
    <div class="modal-footer">
      <button class="btn btn-primary" onclick="closeModal();openInvModal(null,'${pid}')">+ חשבונית חדשה</button>
    </div>`);
}

/* ═══════════════════════════════════════
   EMPLOYEE MODAL
═══════════════════════════════════════ */
function openEmpModal(eid){
  const e=eid?S.employees.find(x=>x.id===eid):null;
  const isEdit=!!e;
  const empClients=CLIENTS.filter(c=>(DEPTS[c.id]||[]).some(d=>d.has_emp));
  const clOpts=empClients.map(c=>`<option value="${c.id}" ${e?.client_id===c.id?'selected':''}>${c.name}</option>`).join('');
  const initCl=e?.client_id||'jlm';
  const empDOpts=buildEmpDeptOpts(initCl,e?.department_id);

  modal(`
    <div class="modal-hdr">
      <span class="modal-title">${isEdit?'עריכת עובד':'עובד חדש'}</span>
      <button class="modal-x" onclick="closeModal()">✕</button>
    </div>
    <div class="fgrid">
      <div class="fg full">
        <label class="flabel">שם העובד *</label>
        <input class="fi" id="ec-name" value="${e?.name||''}" placeholder="שם מלא">
      </div>
      <div class="fg">
        <label class="flabel">לקוח (מקום עבודה)</label>
        <select class="fs" id="ec-cl" onchange="onEmpClChange(this.value)">${clOpts}</select>
      </div>
      <div class="fg">
        <label class="flabel">מחלקה</label>
        <select class="fs" id="ec-dept">${empDOpts}</select>
      </div>
      <div class="fg">
        <label class="flabel">תעריף לשעה (₪)</label>
        <input class="fi" id="ec-rate" type="number" value="${e?.hourly_rate||''}">
      </div>
      <div class="fg">
        <label class="flabel">שעות ממוצע / חודש</label>
        <input class="fi" id="ec-hrs" type="number" value="${e?.monthly_hours||''}">
      </div>
      <div class="fg">
        <label class="flabel">עלות מעסיק / חודש (₪)</label>
        <input class="fi" id="ec-empcost" type="number" value="${e?.employer_cost||''}" placeholder="ממייל רוה"ח">
      </div>
      <div class="fg">
        <label class="flabel">עלות רכב / חודש (₪)</label>
        <input class="fi" id="ec-car" type="number" value="${e?.car_cost_monthly||''}">
      </div>
      <div class="fg">
        <label class="flabel">יש רכב?</label>
        <select class="fs" id="ec-hascar">
          <option value="0" ${!e?.has_car?'selected':''}>לא</option>
          <option value="1" ${e?.has_car?'selected':''}>כן 🚗</option>
        </select>
      </div>
    </div>
    <div class="modal-footer">
      ${isEdit?`<button class="btn btn-red" onclick="delEmp('${e.id}')">🗑 מחק</button>`:''}
      <button class="btn" onclick="closeModal()">ביטול</button>
      <button class="btn btn-primary" onclick="saveEmp('${eid||''}')">💾 שמור</button>
    </div>`);
}
function buildEmpDeptOpts(cid,sel){
  return(DEPTS[cid]||[]).filter(d=>d.has_emp).map(d=>
    `<option value="${d.id}" ${d.id===sel?'selected':''}>${d.name}</option>`
  ).join('');
}
function onEmpClChange(cid){
  document.getElementById('ec-dept').innerHTML=buildEmpDeptOpts(cid);
}
function saveEmp(eid){
  const name=document.getElementById('ec-name').value.trim();
  if(!name){alert('נא להזין שם עובד');return;}
  const d={
    name,
    client_id:document.getElementById('ec-cl').value,
    department_id:document.getElementById('ec-dept').value,
    hourly_rate:parseFloat(document.getElementById('ec-rate').value)||null,
    monthly_hours:parseFloat(document.getElementById('ec-hrs').value)||null,
    employer_cost:parseFloat(document.getElementById('ec-empcost').value)||null,
    car_cost_monthly:parseFloat(document.getElementById('ec-car').value)||null,
    has_car:document.getElementById('ec-hascar').value==='1',
  };
  if(eid){const i=S.employees.findIndex(e=>e.id===eid);if(i>=0)S.employees[i]={...S.employees[i],...d};}
  else S.employees.push({id:uid(),created_at:new Date().toISOString(),...d});
  LS.saveE();closeModal();nav(S.view);
}
function delEmp(eid){
  if(!confirm('למחוק עובד זה?'))return;
  S.employees=S.employees.filter(e=>e.id!==eid);
  LS.saveE();closeModal();nav('employees');
}

/* ═══════════════════════════════════════
   MODAL UTILS
═══════════════════════════════════════ */
function modal(html){
  document.getElementById('modal').innerHTML=html;
  document.getElementById('modal-bg').classList.add('open');
}
function closeModal(){document.getElementById('modal-bg').classList.remove('open');}
function bgClose(e){if(e.target===document.getElementById('modal-bg'))closeModal();}

/* ═══════════════════════════════════════
   FIX: totalAmt is also a local var name
═══════════════════════════════════════ */
function totalAmt(arr,field){return arr.reduce((s,x)=>s+(x[field]||0),0);}

/* ═══════════════════════════════════════
   INIT
═══════════════════════════════════════ */
LS.load();
nav('dashboard');
</script>
