
[functions.payment-agent]
enabled = true
verify_jwt = true
import_map = "./functions/payment-agent/deno.json"
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/payment-agent/index.ts"
# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static HTML pages in your function:
# static_files = [ "./functions/payment-agent/*.html" ]

[functions.weekly-report]
enabled = true
verify_jwt = true
import_map = "./functions/weekly-report/deno.json"
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/weekly-report/index.ts"
# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static HTML pages in your function:
# static_files = [ "./functions/weekly-report/*.html" ]

[functions.debt-mail]
enabled = true
verify_jwt = true
import_map = "./functions/debt-mail/deno.json"
entrypoint = "./functions/debt-mail/index.ts"

[functions.invoices-sync]
enabled = true
# האימות בתוך הפונקציה: כותרת x-sync-key מול הסוד INVOICES_SYNC_KEY (כמו ezcount-webhook).
# מפתח ה-anon ציבורי (יושב ב-index.html) ולכן verify_jwt לא היה הגנה אמיתית.
verify_jwt = false
import_map = "./functions/invoices-sync/deno.json"
entrypoint = "./functions/invoices-sync/index.ts"
